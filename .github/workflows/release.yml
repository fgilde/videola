name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Anders als in der CI: ein halb abgebrochenes Release hinterlaesst ein Image
  # ohne passende Installer.
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # Der secrets-Kontext ist in einem job-level `if:` nicht verfuegbar -- dort gibt
  # es nur github, needs, vars und inputs. Die Existenz der Signatur-Secrets muss
  # darum ueber Job-Outputs transportiert werden, damit die abhaengigen Ziele
  # sichtbar uebersprungen statt rot werden.
  gate:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.probe.outputs.android }}
    steps:
      - id: probe
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "android=yes" >> "$GITHUB_OUTPUT"
          else
            echo "android=no" >> "$GITHUB_OUTPUT"
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # Die zweite Zeile wiederholt bei workflow_dispatch nur die erste, damit
          # ein Lauf von einem Branch nicht :latest ueberschreibt.
          tags: |
            ghcr.io/fgilde/videola:${{ github.ref_name }}
            ghcr.io/fgilde/videola:${{ startsWith(github.ref, 'refs/tags/') && 'latest' || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build crates/videola-core-wasm --target web --out-dir ../../packages/core/src/wasm --out-name videola_core
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: packages/core/src/wasm

  desktop:
    needs: wasm
    strategy:
      # Ein gescheiterter macOS-Build soll die fertigen Windows- und
      # Linux-Installer nicht mitnehmen.
      fail-fast: false
      matrix:
        # --bundles wird pro Plattform gesetzt, weil der Bundler nsis absichtlich
        # nicht auf Windows beschraenkt: die Zielliste aus tauri.conf.json wuerde
        # Linux und macOS einen Windows-Installer bauen lassen.
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # src-tauri ist ein eigener Workspace und bliebe sonst uncached.
          workspaces: |
            .
            apps/desktop/src-tauri
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - name: Linux-Systemabhaengigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: packages/core/src/wasm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Videola ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

  android:
    # Ohne Keystore entstuende nur eine unsignierte APK, die niemand installieren
    # kann -- dann besser sichtbar ueberspringen als ein unbrauchbares Artefakt
    # anhaengen.
    if: needs.gate.outputs.android == 'yes'
    # Nach desktop, damit der teure Mobile-Job erst laeuft wenn die Installer
    # stehen, und damit nur ein Job zugleich das Draft-Release anlegt.
    needs: [gate, wasm, desktop]
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: NDK installieren
        run: |
          sdkmanager "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: packages/core/src/wasm
      - run: pnpm install --frozen-lockfile
      - name: Keystore entpacken
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Android-Projekt erzeugen und Signatur einhaengen
        run: |
          pnpm --filter videola-desktop exec tauri android init --ci
          cat >> apps/desktop/src-tauri/gen/android/app/build.gradle.kts <<'GRADLE'

          // Die Vorlage von `tauri android init` bringt keine signingConfig mit, also
          // waere jede Release-APK unsigniert. Gradle liest die Werte hier direkt aus
          // der Umgebung, statt aus einer keystore.properties, die dieselben Secrets
          // nur ueber eine zusaetzliche Datei transportieren wuerde.
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          GRADLE
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Videola ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          mobile: android
          args: --apk --aab
