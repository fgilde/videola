name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Anders als in der CI: ein halb abgebrochenes Release hinterlaesst ein Image
  # ohne passende Installer.
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # Der secrets-Kontext ist in einem job-level `if:` nicht verfuegbar -- dort gibt
  # es nur github, needs, vars und inputs. Die Existenz der Signatur-Secrets muss
  # darum ueber Job-Outputs transportiert werden, damit die abhaengigen Ziele
  # sichtbar uebersprungen statt rot werden.
  gate:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.probe.outputs.macos }}
      android: ${{ steps.probe.outputs.android }}
      ios: ${{ steps.probe.outputs.ios }}
      updater: ${{ steps.probe.outputs.updater }}
    steps:
      - id: probe
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "macos=yes" >> "$GITHUB_OUTPUT"
          else
            echo "macos=no" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "android=yes" >> "$GITHUB_OUTPUT"
          else
            echo "android=no" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$IOS_CERTIFICATE" ] && [ -n "$IOS_MOBILE_PROVISION" ]; then
            echo "ios=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ios=no" >> "$GITHUB_OUTPUT"
          fi
          # Beide Haelften oder keine: ohne privaten Schluessel entsteht keine
          # Signatur, und ohne oeffentlichen kann kein Installierter sie pruefen.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBKEY" ]; then
            echo "updater=yes" >> "$GITHUB_OUTPUT"
          else
            echo "updater=no" >> "$GITHUB_OUTPUT"
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # Die zweite Zeile wiederholt bei workflow_dispatch nur die erste, damit
          # ein Lauf von einem Branch nicht :latest ueberschreibt.
          tags: |
            ghcr.io/fgilde/videola:${{ github.ref_name }}
            ghcr.io/fgilde/videola:${{ startsWith(github.ref, 'refs/tags/') && 'latest' || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Der Server als ein Tarball fuer jeden, der kein Docker fahren will: ein
  # Proxmox-Container, ein systemd-Dienst auf einem Pi, eine VM beim Hoster. Der
  # Proxmox-Installer laedt genau dieses Asset aus dem letzten Release, deshalb
  # haengt es am Release und nicht an einem Branch.
  #
  # Gebaut mit demselben Skript, das lokal laeuft (`node deploy/bundle.mjs`) --
  # ein Rezept, das nur in einem Workflow existiert, ist das Rezept, das kaputt
  # geht, wenn es gebraucht wird.
  bundle:
    needs: [gate, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: packages/core/src/wasm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter videola-web build && pnpm --filter videola-server build
      - name: Serverpaket packen
        run: node deploy/bundle.mjs
      # Ans Draft-Release gehaengt, das der desktop-Job anlegt. `gh release upload`
      # statt einer Action: das Draft existiert schon, und eine Action, die eines
      # anlegt, wuerde ein zweites erzeugen.
      - name: Ans Release haengen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 60); do
            gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "${{ github.ref_name }}" dist/videola-server-*.tar.gz --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: server-bundle
          path: dist/videola-server-*.tar.gz

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build crates/videola-core-wasm --target web --out-dir ../../packages/core/src/wasm --out-name videola_core
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: packages/core/src/wasm

  desktop:
    needs: [gate, wasm]
    strategy:
      # Ein gescheiterter macOS-Build soll die fertigen Windows- und
      # Linux-Installer nicht mitnehmen.
      fail-fast: false
      matrix:
        # --bundles wird pro Plattform gesetzt, weil der Bundler nsis absichtlich
        # nicht auf Windows beschraenkt: die Zielliste aus tauri.conf.json wuerde
        # Linux und macOS einen Windows-Installer bauen lassen.
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # src-tauri ist ein eigener Workspace und bliebe sonst uncached.
          workspaces: |
            .
            apps/desktop/src-tauri
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - name: Linux-Systemabhaengigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: packages/core/src/wasm
      - name: WASM-Artefakt vorhanden
        shell: bash
        run: test -f packages/core/src/wasm/videola_core.js || (echo "wasm-Artefakt fehlt in packages/core/src/wasm" && exit 1)
      - run: pnpm install --frozen-lockfile
      # Eine leere Apple-Variable ist nicht dasselbe wie eine fehlende: Tauri
      # prueft mit var_os nur auf Existenz und laeuft dann in den Import eines
      # leeren Zertifikats, nach zwanzig Minuten Kompilierung. Die Variablen
      # entstehen darum erst hier und nur, wenn es wirklich ein Zertifikat gibt
      # -- ohne eines bleibt das DMG unsigniert, wie im README zugesagt.
      - name: Apple-Signatur bereitstellen
        if: runner.os == 'macOS' && needs.gate.outputs.macos == 'yes'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || continue
            printf '%s<<APPLE_VALUE\n%s\nAPPLE_VALUE\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      # Die Updater-Konfiguration steht nicht in tauri.conf.json, sondern entsteht
      # hier -- und nur mit Schluessel. Ein eingecheckter Platzhalter-pubkey waere
      # ein Versprechen ohne Deckung, und createUpdaterArtifacts ohne privaten
      # Schluessel bricht das Bundling ab, statt einfach nichts zu signieren.
      - name: Updater konfigurieren
        if: needs.gate.outputs.updater == 'yes'
        shell: bash
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          jq --arg key "$PUBKEY" --arg endpoint "$ENDPOINT" \
            '.bundle.createUpdaterArtifacts = true
             | .plugins.updater = { endpoints: [$endpoint], pubkey: $key }' \
            apps/desktop/src-tauri/tauri.conf.json > "$RUNNER_TEMP/tauri.conf.json"
          mv "$RUNNER_TEMP/tauri.conf.json" apps/desktop/src-tauri/tauri.conf.json
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Videola ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # Heisst `uploadUpdaterJson`, nicht `includeUpdaterJson` -- gegen die
          # action.yml am Tag v1 geprueft, nicht aus dem Gedaechtnis.
          uploadUpdaterJson: ${{ needs.gate.outputs.updater == 'yes' }}
          # Das Draft-Release wird von genau einem Job angelegt und danach nicht
          # mehr aktualisiert (tauri-action laesst Drafts absichtlich in Ruhe),
          # also muss der Text hier stehen statt in einem spaeteren Job.
          releaseBody: |
            Installers for this tag. The notes for the release itself are written on the draft before it
            is published — this text is what the packaging job can say without knowing what went into
            the tag, and saying more from here would be a changelog nobody wrote.

            The macOS DMG is unsigned unless an Apple certificate is configured, so Gatekeeper will block it.
            Android and iOS assets are absent whenever their signing keys are: four assets is the expected
            result, not a failed release.
          args: --bundles ${{ matrix.bundles }}

  android:
    # Ohne Keystore entstuende nur eine unsignierte APK, die niemand installieren
    # kann -- dann besser sichtbar ueberspringen als ein unbrauchbares Artefakt
    # anhaengen.
    if: needs.gate.outputs.android == 'yes'
    # Nach desktop, damit der teure Mobile-Job erst laeuft wenn die Installer
    # stehen, und damit nur ein Job zugleich das Draft-Release anlegt.
    needs: [gate, wasm, desktop]
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: NDK installieren
        run: |
          sdkmanager "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: packages/core/src/wasm
      - name: WASM-Artefakt vorhanden
        run: test -f packages/core/src/wasm/videola_core.js || (echo "wasm-Artefakt fehlt in packages/core/src/wasm" && exit 1)
      - run: pnpm install --frozen-lockfile
      - name: Keystore entpacken
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Android-Projekt erzeugen und Signatur einhaengen
        run: |
          pnpm --filter videola-desktop exec tauri android init --ci
          cat >> apps/desktop/src-tauri/gen/android/app/build.gradle.kts <<'GRADLE'

          // Die Vorlage von `tauri android init` bringt keine signingConfig mit, also
          // waere jede Release-APK unsigniert. Gradle liest die Werte hier direkt aus
          // der Umgebung, statt aus einer keystore.properties, die dieselben Secrets
          // nur ueber eine zusaetzliche Datei transportieren wuerde.
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          GRADLE
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Videola ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          mobile: android
          args: --apk --aab

  ios:
    # An beide Secrets gebunden, weil ohne Zertifikat und Provisioning-Profil gar
    # kein verteilbares IPA entstehen kann.
    if: needs.gate.outputs.ios == 'yes'
    needs: [gate, wasm, desktop]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: packages/core/src/wasm
      - name: WASM-Artefakt vorhanden
        run: test -f packages/core/src/wasm/videola_core.js || (echo "wasm-Artefakt fehlt in packages/core/src/wasm" && exit 1)
      - run: pnpm install --frozen-lockfile
      - name: Signatur einrichten
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          printf '%s' "$IOS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          printf '%s' "$IOS_MOBILE_PROVISION" | base64 -d > "$PROFILES/videola.mobileprovision"
      - name: Xcode-Projekt erzeugen
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter videola-desktop exec tauri ios init --ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Videola ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          mobile: ios
          # app-store-connect passt zum Distribution-Zertifikat aus IOS_CERTIFICATE;
          # release-testing oder debugging wuerden ein anderes verlangen und der
          # Export scheiterte mit einer wenig hilfreichen Xcode-Meldung.
          args: --export-method app-store-connect

  summary:
    # Ohne always() fehlt die Uebersicht genau dann, wenn ein Ziel gescheitert ist.
    if: always()
    # gate gehoert dazu, sonst zeigen android und ios `skipped` und die Tabelle
    # kann nicht auf die Ursache zeigen.
    needs: [gate, docker, wasm, desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Ergebnis zusammenfassen
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Release $TAG"
            echo
            echo "| Ziel | Ergebnis |"
            echo "|---|---|"
            echo "| Signatur-Secrets pruefen | ${{ needs.gate.result }} |"
            echo "| Docker (ghcr.io) | ${{ needs.docker.result }} |"
            echo "| WASM-Kern | ${{ needs.wasm.result }} |"
            echo "| Desktop (Windows, Linux, macOS) | ${{ needs.desktop.result }} |"
            echo "| Android (APK, AAB) | ${{ needs.android.result }} |"
            echo "| iOS (IPA) | ${{ needs.ios.result }} |"
            echo
            echo "\`skipped\` heisst: das Signatur-Secret fehlt, oder ein vorausgesetzter Job ist gescheitert. Die Secrets stehen im README unter Release."
          } >> "$GITHUB_STEP_SUMMARY"
