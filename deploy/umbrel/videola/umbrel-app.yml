manifestVersion: 1
id: videola
name: Videola
tagline: Cut, grade, mix and export video in your browser
category: media
version: "0.9.0"
port: 7331
description: >-
  A video editor that runs in a browser and keeps its project model, its command bus and its file format
  in a Rust core compiled to WebAssembly. Import footage, cut it on a timeline, keyframe anything,
  grade it against real scopes, mix the sound to a loudness target and export an MP4 — all on the
  machine it is running on, with no upload anywhere.


  What comes with it: thirteen templates that bake into ordinary projects, motion blur averaged over
  eight real instants of a shutter, spectral noise reduction learned from the pauses in a recording,
  stereo or 5.1 surround with a position per track, scene detection that splits a camera card into its
  takes, and an HTTP API plus an MCP server so an agent can edit a project and look at what it did.


  Every /api call needs the token this app generates. That is not decoration: the server refuses to
  listen on anything but loopback without one, because an open Videola hands out read and write access
  to its storage.
developer: gilde.org
website: https://fgilde.github.io/videola/
