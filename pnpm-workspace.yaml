packages:
  - packages/*
  - apps/*
allowBuilds:
  # esbuild ships its binary in the platform-specific optional package (@esbuild/<platform>);
  # its install script only re-resolves that same binary, so skipping it costs nothing and keeps
  # the workspace free of post-install scripts.
  esbuild: false
  # transformers.js names the Node runtime of onnxruntime as a dependency; the editor runs the
  # model in the browser and never loads it, so its binary download is skipped.
  onnxruntime-node: false
  protobufjs: false
minimumReleaseAgeExclude:
  - mediabunny@1.58.0
