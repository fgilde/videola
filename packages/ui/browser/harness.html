<body><pre id="out">pending</pre>
<link rel="stylesheet" href="./bundle.css">
<style>
  html, body { margin: 0; }
  /* An offset host, so anything that forgets to subtract the surface origin shows up. */
  #host { position: absolute; left: 37px; top: 53px; width: 1060px; height: 420px; }
  /* The inspector gets its own root: it is mounted inside a .v-shell whose data-layout is what
     decides its touch targets, and the timeline host must not carry that attribute. */
  #panel { position: absolute; left: 37px; top: 500px; width: 360px; height: 380px; display: flex; }
  /* The instruments and the curve field get hosts of their own: both are drawings whose whole
     claim is about pixels, and neither can be measured inside a box with no size. */
  #scopes { position: absolute; left: 420px; top: 500px; width: 640px; height: 220px; }
  #curve { position: absolute; left: 420px; top: 760px; width: 300px; height: 300px; display: flex; }
  /* The width of the rail the library really lives in, so its toolbar wraps here the way it wraps
     in the editor rather than being given room it will not have. */
  #library { position: absolute; left: 760px; top: 760px; width: 240px; height: 400px; display: flex; }
  #out { position: absolute; left: 0; top: 1300px; }
</style>
<script src="./bundle.js"></script>
<script>
const SECOND = 705600000;
const results = [];
// Which pointer the runner pinned for this pass. Everything in here holds for both except the
// sizes of the controls, and those are the whole reason there are two passes.
const POINTER = new URLSearchParams(location.search).get("pointer") || "fine";

function check(name, got, want) {
  results.push({ name, ok: JSON.stringify(got) === JSON.stringify(want), got, want });
}

function checkAtMost(name, got, limit) {
  results.push({ name, ok: typeof got === "number" && got <= limit, got, want: "<= " + limit });
}

function checkAtLeast(name, got, limit) {
  results.push({ name, ok: typeof got === "number" && got >= limit, got, want: ">= " + limit });
}

function test(name, fn) {
  try {
    fn();
  } catch (error) {
    results.push({ name, ok: false, got: "THREW " + error.name + ": " + error.message, want: "no throw" });
  }
}

function clip(id, startSeconds, durationSeconds, over) {
  return Object.assign({
    id,
    label: id,
    source: { kind: "generator", generator: { type: "solid", color: "#ff0000" } },
    start: Math.round(startSeconds * SECOND),
    duration: Math.round(durationSeconds * SECOND),
    inPoint: 0,
    speed: { rate: 1, reverse: false, preservePitch: true },
    transform: {}, blend: "normal", fades: { inDuration: 0, outDuration: 0 },
    volume: 1, pan: 0, effects: [], keyframes: {},
  }, over || {});
}

function track(id, clips, colorHex, kind) {
  return { id, kind: kind || "video", name: id, colorHex: colorHex || "#5b8cff", height: 72,
    locked: false, hidden: false, muted: false, solo: false, volume: 1, pan: 0,
    clips: clips, effects: [] };
}

function project(tracks, markers) {
  return {
    schemaVersion: 1, meta: { id: "prj_1", title: "", tags: [] },
    settings: { width: 1920, height: 1080, fps: { numerator: 30, denominator: 1 },
      sampleRate: 48000, colorSpace: "srgb", background: "#000000" },
    library: [], timeline: { tracks: tracks }, markers: markers || [],
    master: { volume: 1, effects: [] },
  };
}

// Both surfaces name effect parameters from the same manifest the application hands them, so a
// lane row and the inspector row it belongs to cannot end up calling one parameter two things.
const BRIGHTNESS = {
  id: "brightness", name: { de: "Helligkeit", en: "Brightness" }, inputs: 1,
  params: [{ key: "amount", name: { de: "Stärke", en: "Amount" }, default: 1, min: 0, max: 4 }],
};

const host = document.createElement("div");
host.id = "host";
document.body.append(host);
// Both harnesses look controls up by their German labels, and the language otherwise follows
// the browser: German on this machine, English on a CI runner. Pinning it is what makes the
// two runs the same run.
localStorage.setItem("videola.locale", "de");

const root = T.createRoot(host);

// The dispatch only records. A faithful fake of the core would be the trap Gruppe B paid for;
// what this harness is for is boxes, and the commands are recorded to prove which one was sent.
let sent = [];
let seeks = [];

// Every check starts from a fresh mount: zoom, selection and scroll all live inside the
// component, and a leftover from the previous check is a silent lie about the next one.
function draw(scene, playhead, dispatch) {
  T.flushSync(function () { root.render(null); });
  T.flushSync(function () {
    root.render(T.createElement(T.I18nProvider, null, T.createElement(T.Timeline, {
      project: scene,
      playhead: playhead || 0,
      effects: [BRIGHTNESS],
      // A fixture, and deliberately not a claim about any shape. There is no wasm on a file:// page
      // and every check in this file is about boxes on the page. That the plotted line really is
      // the core's own easing is proven where the core actually runs: keyframeEditing.test.tsx
      // loads the module and reads the path back, and gpu/harness.html measures it at pixels.
      curveShape: function (left, right, count) {
        const shape = [];
        for (let i = 0; i < count; i += 1) shape.push(i / (count - 1));
        return shape;
      },
      dispatch: dispatch || function (command, key) { sent.push({ command: command, key: key }); },
      onSeek: function (time) { seeks.push(time); },
    })));
  });
}

function reset() { sent = []; seeks = []; }
function q(selector) { return host.querySelector(selector); }
function all(selector) { return Array.from(host.querySelectorAll(selector)); }
function surface() { return q(".v-timeline__scroll"); }
function toolbar() { return all(".v-timeline__toolbar .v-button"); }

function pointer(type, target, init) {
  const event = new PointerEvent(type, Object.assign({
    bubbles: true, cancelable: true, pointerId: 1, pointerType: "mouse", isPrimary: true,
    button: 0, buttons: 1, view: window,
  }, init));
  T.flushSync(function () { target.dispatchEvent(event); });
  return event;
}

// Surface coordinates to page coordinates, so every check states where it is pointing in the
// same terms the user does.
function atSurface(x, y) {
  const box = surface().getBoundingClientRect();
  return { clientX: box.left + x, clientY: box.top + y };
}

function click(element) {
  T.flushSync(function () { element.click(); });
}

// ---------------------------------------------------------------- the element width ceiling

test("element width", function () {
  const probe = document.createElement("div");
  probe.style.cssText = "position:absolute;top:2000px;height:1px";
  probe.style.width = T.MAX_ELEMENT_WIDTH_PX + "px";
  document.body.append(probe);
  check("a content div as wide as the ceiling keeps its width",
    Math.round(probe.getBoundingClientRect().width), T.MAX_ELEMENT_WIDTH_PX);
  probe.remove();
});

// ---------------------------------------------------------------- virtualisation over zoom

test("virtualisation", function () {
  const clips = [];
  for (let i = 0; i < 3600; i += 1) clips.push(clip("clp_" + i, i, 1));
  const hour = project([track("trk_1", clips)]);
  draw(hour);

  const counts = [];
  const boxes = [];
  for (let step = 0; step < 22; step += 1) {
    counts.push(q(".v-timeline").querySelectorAll("*").length);
    boxes.push(all("[data-clip-id], [data-clip-run]").length);
    click(toolbar()[0]);
  }
  checkAtMost("the whole subtree stays small at every zoom step", Math.max.apply(null, counts), 400);
  checkAtMost("clip boxes stay bounded by the viewport, not by the material",
    Math.max.apply(null, boxes), 200);
  checkAtLeast("and something is still drawn when fully zoomed out",
    boxes[boxes.length - 1], 1);
});

test("virtualisation while scrolled", function () {
  const clips = [];
  for (let i = 0; i < 3600; i += 1) clips.push(clip("clp_" + i, i, 1));
  draw(project([track("trk_1", clips)]));
  surface().scrollLeft = 120000;
  surface().dispatchEvent(new Event("scroll"));
  T.flushSync(function () {});
  checkAtMost("scrolled far out, the subtree is still small",
    q(".v-timeline").querySelectorAll("*").length, 400);
  checkAtLeast("and the window followed the scroll", all("[data-clip-id]").length, 1);
});

test("scroll width", function () {
  draw(project([track("trk_1", [clip("clp_1", 0, 3600)])]));
  checkAtLeast("the surface scrolls the whole hour", surface().scrollWidth, 360000);
});

// ---------------------------------------------------------------- touch targets as geometry

test("touch targets", function () {
  draw(project([track("trk_1", [clip("clp_1", 0, 10)])]));
  const box = q("[data-clip-id]").getBoundingClientRect();
  const zone = q('[data-edge="end"]').getBoundingClientRect();
  check("the coarse trim zone is 44 px wide", Math.round(zone.width), 44);
  check("and reaches the clip's outer edge", Math.round(zone.right - box.right), 0);
  const startZone = q('[data-edge="start"]').getBoundingClientRect();
  check("the leading zone reaches the other outer edge", Math.round(startZone.left - box.left), 0);
  check("--v-touch-target resolves",
    getComputedStyle(document.documentElement).getPropertyValue("--v-touch-target").trim(), "44px");
  checkAtLeast("a track row is at least a touch target tall",
    Math.round(q(".v-track").getBoundingClientRect().height), 44);
});

test("narrow clip zones", function () {
  draw(project([track("trk_1", [clip("clp_1", 0, 0.333)])]));
  const box = q("[data-clip-id]").getBoundingClientRect();
  const startZone = q('[data-edge="start"]').getBoundingClientRect();
  const endZone = q('[data-edge="end"]').getBoundingClientRect();
  checkAtMost("the two zones never overlap on a narrow clip",
    Math.round(startZone.right - endZone.left), 0);
  checkAtLeast("and both stay grabbable", Math.round(Math.min(startZone.width, endZone.width)), 2);
  checkAtLeast("the clip is not inflated past its own duration by padding",
    35, Math.round(box.width));
});

// ---------------------------------------------------------------- touch panning

test("touch action", function () {
  draw(project([track("trk_1", [clip("clp_1", 0, 3600)])]));
  const surfaceAction = getComputedStyle(surface()).touchAction;
  check("the surface lets the browser pan sideways",
    surfaceAction === "auto" || surfaceAction.includes("pan-x"), true);
  check("a clip keeps its own drag", getComputedStyle(q("[data-clip-id]")).touchAction, "none");
  check("the ruler keeps its own scrub", getComputedStyle(q(".v-ruler")).touchAction, "none");
});

// ---------------------------------------------------------------- page offsets

test("page offset", function () {
  draw(project([track("trk_1", [clip("clp_1", 0, 10)])]));
  reset();
  const at = atSurface(500, 8);
  pointer("pointerdown", q(".v-ruler"), at);
  pointer("pointerup", surface(), at);
  check("scrubbing at surface x 500 seeks five seconds", seeks[seeks.length - 1], 5 * SECOND);
});

// The three things that made a clip read as a grey rectangle: a centred name, square corners, and
// a selection you had to look twice for. The name is measured through a Range, because the label
// box fills the clip whatever the text inside it does -- reading text-align back would only be the
// rule restating itself.
test("a clip looks like a clip", function () {
  draw(project([track("trk_1", [clip("clp_1", 0, 10)])]));
  const box = q("[data-clip-id]");
  const range = document.createRange();
  range.selectNodeContents(q(".v-clip__label"));
  checkAtMost("the name starts at the left edge instead of in the middle",
    Math.round(range.getBoundingClientRect().left - box.getBoundingClientRect().left), 12);
  checkAtLeast("the corners are rounded",
    parseFloat(getComputedStyle(box).borderTopLeftRadius), 4);
  check("an unselected clip lies flat", getComputedStyle(box).boxShadow, "none");
  pointer("pointerdown", box, atSurface(100, 90));
  pointer("pointerup", surface(), atSurface(100, 90));
  check("and choosing one lifts it off the row",
    getComputedStyle(q("[data-clip-id]")).boxShadow !== "none", true);
});

// What a clip is made of has to be readable before its name is: a row of grey rectangles says
// nothing about which of them carries sound. Read out of the computed style rather than out of the
// class list, because what is claimed is that they *look* different.
test("clip colour follows the track kind", function () {
  draw(project([
    track("trk_1", [clip("clp_1", 0, 10)]),
    track("trk_2", [clip("clp_2", 0, 10)], null, "audio"),
  ]));
  const fills = all("[data-clip-id]").map(function (node) {
    return getComputedStyle(node).backgroundColor;
  });
  check("both kinds are drawn on screen", fills.length, 2);
  check("neither of them is left unpainted",
    fills.filter(function (fill) { return fill === "rgba(0, 0, 0, 0)"; }).length, 0);
  check("and a clip on a sound track is not the colour of one on a picture track",
    fills[0] === fills[1], false);
});

test("track colour survives scrolling", function () {
  draw(project([track("trk_1", [clip("clp_1", 0, 3600)], "#ff00ff")]));
  surface().scrollLeft = 4000;
  const header = q(".v-timeline__header");
  const colour = getComputedStyle(header).borderLeftColor;
  check("the track colour sits in the sticky header", colour, "rgb(255, 0, 255)");
  checkAtLeast("and the header is still on screen",
    Math.round(header.getBoundingClientRect().width), 1);
});

// ---------------------------------------------------------------- zoom bursts

test("zoom burst", function () {
  draw(project([track("trk_1", [clip("clp_1", 0, 60)])]));
  const before = q("[data-clip-id]").getBoundingClientRect().width;
  for (let i = 0; i < 4; i += 1) toolbar()[1].click();
  T.flushSync(function () {});
  const after = q("[data-clip-id]").getBoundingClientRect().width;
  checkAtLeast("four zoom steps in one task compound", Math.round(after / before), 16);
});

// ---------------------------------------------------------------- the context menu

test("context menu", function () {
  draw(project([track("trk_1", [clip("clp_1", 0, 10)])]), 3 * SECOND);
  const at = atSurface(200, 90);
  const menuEvent = new MouseEvent("contextmenu", Object.assign({ bubbles: true, cancelable: true }, at));
  T.flushSync(function () { q("[data-clip-id]").dispatchEvent(menuEvent); });
  const items = all('[role="menuitem"]');
  check("every entry the clip menu promises is there", items.map(function (item) { return item.textContent; }),
    ["Am Playhead teilen", "Schnitte in diesem Clip finden", "Bild hier einfrieren",
     "Clip ausschalten", "Clip löschen", "Löschen und Lücke schließen", "Kopieren", "Ausschneiden",
     "Am Playhead einfügen", "Attribute einfügen", "Gruppieren", "Gruppierung aufheben",
     "Verschachteln", "Mit naechstem Untertitel verbinden", "Geteilter Bildschirm"]);
  // The freeze needs two seconds of material after the playhead and a host that can run it. This
  // harness renders the timeline without one, so the entry says so rather than doing nothing.
  check("a freeze with no host to run it is disabled",
    items.find(function (item) { return item.textContent === "Bild hier einfrieren"; }).disabled, true);
  const short = items.filter(function (item) {
    return Math.round(item.getBoundingClientRect().height) < 44;
  });
  check("no entry is smaller than a touch target", short.length, 0);
  // Nothing has been copied, nothing else is selected: an entry that cannot act says so rather
  // than sending a command the core would refuse.
  // By name rather than by index. Twice in two commits a new entry shifted these, and an index is not
  // what the check is about: "paste with an empty clipboard is disabled" says nothing about position.
  const entry = function (text) {
    return items.find(function (item) { return item.textContent === text; });
  };
  check("paste and group are disabled until they can do something",
    [entry("Am Playhead einfügen").disabled, entry("Attribute einfügen").disabled,
     entry("Gruppieren").disabled, entry("Kopieren").disabled],
    [true, true, true, false]);
  // The split screen is the one entry that needs a second clip, and with one selected it says so
  // rather than offering a half a screen can be split into.
  check("a split screen is disabled until two clips are selected",
    entry("Geteilter Bildschirm").disabled, true);
  // Where it lands is measured against the window rather than against the pointer alone: a menu of
  // fifteen entries is taller than what is under the pointer in a short window, and then the right
  // answer is *not* the pointer -- it is pulled back so the last entry is still reachable. Both halves
  // are asserted here because either one alone passes a menu that is wrong: the pointer alone accepts
  // a menu hanging out of the window, and "inside the window" alone accepts a menu parked anywhere.
  const menuBox = q('[role="menu"]').getBoundingClientRect();
  check("the menu opens at the pointer horizontally", Math.round(menuBox.left), at.clientX);
  check("and at the pointer vertically unless it would not fit",
    Math.round(menuBox.top) === at.clientY || Math.round(menuBox.bottom) <= window.innerHeight, true);
  check("the whole menu is inside the window",
    [menuBox.top >= 0, Math.round(menuBox.bottom) <= window.innerHeight,
     Math.round(menuBox.right) <= window.innerWidth],
    [true, true, true]);
});

// ---------------------------------------------------------------- markers

test("markers", function () {
  draw(project([track("trk_1", [clip("clp_1", 0, 10)])],
    [{ id: "mrk_1", time: 3 * SECOND, label: "chapter", colorHex: "#f0a030" }]));
  reset();
  const flag = q("[data-marker-id]");
  const box = flag.getBoundingClientRect();
  check("the marker stands at its own time", Math.round(box.left - surface().getBoundingClientRect().left), 300);
  checkAtLeast("and is wide enough to be hit", Math.round(box.width), 10);
  click(flag);
  check("clicking it moves the playhead there", seeks[seeks.length - 1], 3 * SECOND);

  const menuEvent = new MouseEvent("contextmenu", Object.assign({ bubbles: true, cancelable: true }, atSurface(300, 4)));
  T.flushSync(function () { flag.dispatchEvent(menuEvent); });
  const items = all('[role="menuitem"]');
  check("its own menu offers exactly one thing to do", items.length, 1);
  click(items[0]);
  check("and that thing removes the marker", sent[sent.length - 1].command.type, "marker.remove");
});

// ---------------------------------------------------------------- the two drag modes

function chooseMode(label, value) {
  const select = all(".v-timeline__toolbar select").find(function (element) {
    return element.getAttribute("aria-label") === label;
  });
  select.value = value;
  T.flushSync(function () {
    select.dispatchEvent(new Event("change", { bubbles: true }));
  });
}

test("edge and drag modes", function () {
  draw(project([track("trk_1", [clip("clp_1", 0, 2), clip("clp_2", 2, 2)])]));
  chooseMode("Kante ziehen", "ripple");
  reset();
  pointer("pointerdown", all('[data-edge="end"]')[0], atSurface(200, 90));
  pointer("pointermove", surface(), atSurface(300, 90));
  pointer("pointerup", surface(), atSurface(300, 90));
  check("the edge mode decides which command an edge drag sends",
    sent.length === 0 ? "nothing sent" : sent[0].command.type, "clip.rippleTrim");

  draw(project([track("trk_1", [clip("clp_1", 0, 2), clip("clp_2", 2, 2)])]));
  chooseMode("Clip ziehen", "slip");
  reset();
  pointer("pointerdown", q("[data-clip-id]"), atSurface(100, 90));
  pointer("pointermove", surface(), atSurface(200, 90));
  pointer("pointerup", surface(), atSurface(200, 90));
  check("and the drag mode which command a clip drag sends",
    sent.length === 0 ? "nothing sent" : sent[0].command.type, "clip.slip");
});

// ---------------------------------------------------------------- more than one clip at a time

test("multiple selection", function () {
  draw(project([track("trk_1", [clip("clp_1", 0, 2), clip("clp_2", 3, 2)])]));
  pointer("pointerdown", all("[data-clip-id]")[0], atSurface(100, 90));
  pointer("pointerup", surface(), atSurface(100, 90));
  pointer("pointerdown", all("[data-clip-id]")[1], Object.assign({ ctrlKey: true }, atSurface(350, 90)));
  pointer("pointerup", surface(), Object.assign({ ctrlKey: true }, atSurface(350, 90)));
  check("both clips read as selected",
    all("[data-clip-id]").map(function (element) { return element.dataset.selected; }), ["true", "true"]);

  reset();
  pointer("pointerdown", all("[data-clip-id]")[1], atSurface(350, 90));
  pointer("pointermove", surface(), atSurface(450, 90));
  pointer("pointerup", surface(), atSurface(450, 90));
  const last = sent.slice(-2);
  check("a drag moves both by the same step",
    last.map(function (entry) { return entry.command.start; }), [1 * SECOND, 4 * SECOND]);
  check("in one undo step", last[0].key, last[1].key);
});

// ---------------------------------------------------------------- the buttons the mouse has

test("secondary buttons", function () {
  draw(project([track("trk_1", [clip("clp_1", 0, 10)])]));
  reset();
  const from = atSurface(100, 90);
  pointer("pointerdown", q("[data-clip-id]"), Object.assign({ button: 2, buttons: 2 }, from));
  pointer("pointermove", surface(), Object.assign({ button: 2, buttons: 2 }, atSurface(400, 90)));
  pointer("pointerup", surface(), Object.assign({ button: 2, buttons: 0 }, atSurface(400, 90)));
  check("the right mouse button edits nothing", sent.length, 0);
});

// ---------------------------------------------------------------- a cancelled drag

test("pointer cancel", function () {
  draw(project([track("trk_1", [clip("clp_1", 2, 10)])]));
  reset();
  pointer("pointerdown", q("[data-clip-id]"), atSurface(300, 90));
  pointer("pointermove", surface(), atSurface(600, 90));
  pointer("pointercancel", surface(), atSurface(600, 90));
  const last = sent[sent.length - 1];
  check("a cancelled drag puts the clip back",
    last === undefined ? "nothing sent" : last.command.start, 2 * SECOND);
  check("under the same coalesce key", last === undefined ? "nothing sent" : last.key, sent[0].key);
});

// ---------------------------------------------------------------- a drag at the limit

test("limit dragging", function () {
  draw(project([track("trk_1", [clip("clp_1", 0, 2)])]));
  let escaped = 0;
  const onError = function () { escaped += 1; };
  window.addEventListener("error", onError);
  // What the core does when a trim would empty a clip, and what apps/web hands the timeline.
  draw(project([track("trk_1", [clip("clp_1", 0, 2)])]), 0, function () {
    throw new Error("invalid argument: trim would empty the clip");
  });
  pointer("pointerdown", q('[data-edge="end"]'), atSurface(200, 90));
  for (let i = 1; i <= 40; i += 1) pointer("pointermove", surface(), atSurface(200 - i * 10, 90));
  pointer("pointerup", surface(), atSurface(-200, 90));
  window.removeEventListener("error", onError);
  check("a refused edit never escapes the gesture", escaped, 0);
});

// ---------------------------------------------------------------- the keyframe lane as geometry

// Two tracks on one clip, three keys on the first. The second is there so "one row per track" is
// a claim the fixture can fail.
function keyframedClip() {
  return clip("clp_1", 0, 10, {
    keyframes: {
      opacity: [
        { time: 1 * SECOND, value: { kind: "float", value: 0 }, interp: "linear" },
        { time: 4 * SECOND, value: { kind: "float", value: 1 }, interp: "hold" },
        { time: 7 * SECOND, value: { kind: "float", value: 0.5 }, interp: "ease" },
      ],
    },
    effects: [{ id: "eff_1", effectType: "brightness", enabled: true,
      params: { amount: { kind: "float", value: 1 } },
      keyframes: { amount: [{ time: 2 * SECOND, value: { kind: "float", value: 0 }, interp: "linear" }] } }],
  });
}

function drawLane() {
  draw(project([track("trk_1", [keyframedClip()])]));
  // The lane follows the clip selection, the same one the inspector follows.
  pointer("pointerdown", q("[data-clip-id]"), atSurface(200, 90));
  pointer("pointerup", surface(), atSurface(200, 90));
  reset();
}

test("the lane is drawn on the timeline's own axis", function () {
  drawLane();
  const rows = all(".v-keylane__row");
  check("one row per non-empty track", rows.length, 2);

  const keys = all(".v-keylane__key");
  check("one point per keyframe", keys.length, 4);

  // The claim the whole lane rests on: a keyframe at four seconds stands where the ruler's four
  // second tick stands, measured on the page rather than derived from the same arithmetic twice.
  const four = keys.filter(function (node) {
    return node.dataset.keyframeTime === String(4 * SECOND);
  })[0];
  const tick = all(".v-ruler__tick").filter(function (node) {
    return node.textContent.indexOf(":04.") >= 0;
  })[0];
  check("a key stands on the ruler tick of its own time",
    tick === undefined || four === undefined
      ? "missing"
      : Math.round(four.getBoundingClientRect().left + four.getBoundingClientRect().width / 2
          - tick.getBoundingClientRect().left),
    0);

  // The playhead crosses the lane rather than stopping above it -- one surface, one instant.
  const head = q(".v-timeline__playhead").getBoundingClientRect();
  const lane = q(".v-keylane").getBoundingClientRect();
  checkAtLeast("the playhead reaches the bottom of the lane",
    Math.round(head.bottom - lane.bottom), 0);
});

test("keyframe touch targets", function () {
  drawLane();
  const key = q(".v-keylane__key").getBoundingClientRect();
  const row = q(".v-keylane__row").getBoundingClientRect();
  if (POINTER === "fine") {
    checkAtMost("a mouse gets a compact point", Math.round(key.width), 32);
    checkAtMost("on a compact row", Math.round(row.height), 32);

// ---------------------------------------------------------------- the curve field as geometry

// The same clip, with the first key set to the one interpolation that carries a shape to drag.
function curvedClip() {
  const only = keyframedClip();
  only.keyframes.opacity[0].interp = "bezier";
  return only;
}

// Picked, then opened: the field lives behind a disclosure so a curve nobody asked for takes no
// row of the shortest panel on the screen.
function openCurve() {
  draw(project([track("trk_1", [curvedClip()])]));
  pointer("pointerdown", q("[data-clip-id]"), atSurface(200, 90));
  pointer("pointerup", surface(), atSurface(200, 90));
  const key = all(".v-keylane__key").filter(function (node) {
    return node.dataset.keyframeTime === String(1 * SECOND);
  })[0];
  pointer("pointerdown", key, atSurface(10, 10));
  pointer("pointerup", surface(), atSurface(10, 10));
  // Through the summary, the way a person opens one: the element's own state is overwritten by the
  // next render, and every pointer move of a handle drag is one.
  T.flushSync(function () { q(".v-keycurve__summary").click(); });
  reset();
  return q("[data-testid='keyframe-curve-disclosure']");
}

test("the curve field sits beside the picked keyframe, not on the timeline's axis", function () {
  openCurve();
  const field = q("[data-testid='keyframe-curve']");
  check("the field is there once a key is picked and the disclosure opened", field !== null, true);
  check("and outside the scrolling area, like the rest of the bar",
    surface().contains(field), false);
  check("and outside the lane, which has no value axis to put it on",
    q(".v-keylane").contains(field), false);

  // A curve is read as a square: the same span across as up, so a shape is not stretched into
  // looking gentler than it is. The *field* is taller than that, because it reaches past the unit
  // square at both ends so an overshoot -- what a bounce is made of -- can be seen and dragged. So
  // what has to be square is the unit square itself, and it is measured between the two lines that
  // mark where the travel sets off and arrives rather than computed from a fraction this file would
  // then have to keep in step with the stylesheet.
  const box = q(".v-curve").getBoundingClientRect();
  const bounds = [...document.querySelectorAll(".v-keycurve .v-curve__bound")]
    .map((line) => line.getBoundingClientRect().top)
    .sort((a, b) => a - b);
  check("both ends of the travel are drawn", bounds.length, 2);
  // Against the content box and not the border box: the two lines are drawn inside the border, and
  // a one-pixel rule at each end is exactly the two pixels that would otherwise read as a stretch.
  check("the unit square is square",
    Math.round(q(".v-keycurve .v-curve").clientWidth - (bounds[1] - bounds[0])), 0);
  checkAtLeast("and the field reaches past it, which is where an overshoot goes",
    Math.round(box.height - box.width), 40);
  checkAtLeast("and big enough to aim inside", Math.round(box.width), 120);

  // It must not push the tracks off the screen: the picture is the largest zone here.
  checkAtLeast("the timeline still has room for its tracks below it",
    Math.round(q(".v-timeline__body").getBoundingClientRect().height), 100);
});

// ---------------------------------------------------------------- the inspector as geometry

const panel = document.createElement("div");
panel.id = "panel";
panel.className = "v-shell";
document.body.append(panel);
const panelRoot = T.createRoot(panel);

function clipWithEffect() {
  return clip("clp_1", 0, 10, {
    source: { kind: "media", media: "med_1" },
    transform: { x: 0, y: 0, scaleX: 1, scaleY: 1, rotation: 0, anchorX: 0.5, anchorY: 0.5,
      opacity: 1, crop: { left: 0, top: 0, right: 0, bottom: 0 } },
    // A keyframed transform field as well as a keyframed effect parameter: the two go through
    // different addresses in the command layer and only one of them used to have a switch.
    keyframes: { rotation: [{ time: 0, value: { kind: "float", value: 0 }, interp: "linear" },
                            { time: 5 * SECOND, value: { kind: "float", value: 180 }, interp: "linear" }] },
    effects: [{ id: "eff_1", effectType: "brightness", enabled: true,
      params: { amount: { kind: "float", value: 1 } },
      keyframes: { amount: [{ time: 0, value: { kind: "float", value: 0 }, interp: "linear" },
                            { time: 5 * SECOND, value: { kind: "float", value: 4 }, interp: "linear" }] } }],
  });
}

function drawInspector(layout) {
  const only = clipWithEffect();
  const scene = project([track("trk_1", [only])]);
  scene.library = [{ id: "med_1", originalName: "a.mp4", mimeType: "video/mp4", kind: "video",
    width: 640, height: 360, duration: 10 * SECOND }];
  panel.setAttribute("data-layout", layout);
  T.flushSync(function () { panelRoot.render(null); });
  T.flushSync(function () {
    panelRoot.render(T.createElement(T.I18nProvider, null, T.createElement(T.Inspector, {
      project: scene,
      clip: "clp_1",
      playhead: 0,
      effects: [BRIGHTNESS],
      effectParamsAt: function () {
        return new Map([["eff_1", new Map([["amount", { kind: "float", value: 0 }]])]]);
      },
      // What the core would resolve. The fixture keyframes `rotation`, so the row that shows it
      // has to read 90 rather than the 0 the clip holds at rest.
      transformsAt: function () {
        return new Map([["clp_1", Object.assign({}, only.transform, { rotation: 90 })]]);
      },
      dispatch: function (command, key) { sent.push({ command: command, key: key }); },
      onSeek: function (time) { seeks.push(time); },
    })));
  });
}

function inPanel(selector) { return panel.querySelector(selector); }
function allInPanel(selector) { return Array.from(panel.querySelectorAll(selector)); }

// ---------------------------------------------------------------- the instruments, on real pixels
//
// Everything below here needs a canvas the browser actually rasterises. jsdom has none, so a unit
// test can say the panel rendered three figures and nothing at all about whether they show a
// measurement -- which is the only thing a scope is for.

const scopesHost = document.createElement("div");
scopesHost.id = "scopes";
scopesHost.className = "v-shell";
document.body.append(scopesHost);
const scopesRoot = T.createRoot(scopesHost);

const TARGETS = [{ name: "R", x: 0.42, y: 0.13 }, { name: "B", x: 0.87, y: 0.54 }];

function emptyReading() {
  return {
    histogram: { red: new Uint32Array(256), green: new Uint32Array(256),
      blue: new Uint32Array(256), luma: new Uint32Array(256) },
    waveform: new Uint32Array(64 * 256), columns: 64,
    vectorscope: new Uint32Array(128 * 128), measured: 0, range: undefined,
  };
}

// A picture dark on the left and bright on the right, red-shifted throughout. Each of the three
// instruments has something different to say about it, which is what tells them apart.
function slopedReading() {
  const shot = emptyReading();
  for (let column = 0; column < 64; column += 1) {
    const level = Math.round((column / 63) * 200) + 20;
    shot.waveform[column * 256 + level] = 100;
    shot.histogram.luma[level] += 100;
    shot.histogram.red[Math.min(255, level + 30)] += 100;
    shot.histogram.green[level] += 100;
    shot.histogram.blue[Math.max(0, level - 30)] += 100;
  }
  shot.vectorscope[40 * 128 + 90] = 500;
  shot.measured = 6400;
  shot.range = [20, 220];
  return shot;
}

function drawScopes(reading, layout) {
  scopesHost.setAttribute("data-layout", layout || "desktop");
  T.flushSync(function () { scopesRoot.render(null); });
  T.flushSync(function () {
    scopesRoot.render(T.createElement(T.I18nProvider, null,
      T.createElement(T.Scopes, { reading: reading, targets: TARGETS })));
  });
}

function scopeCanvas(title) {
  return Array.from(scopesHost.querySelectorAll(".v-scope")).find(function (figure) {
    return figure.querySelector(".v-scope__title").textContent === title;
  }).querySelector("canvas");
}

// How many pixels of a canvas carry ink, and where. Read back through getImageData, which is the
// only way to tell a drawing from an empty box.
function inked(canvas, region) {
  const two = document.createElement("canvas");
  two.width = canvas.width;
  two.height = canvas.height;
  const context = two.getContext("2d");
  context.drawImage(canvas, 0, 0);
  const box = region || { x: 0, y: 0, w: canvas.width, h: canvas.height };
  const data = context.getImageData(box.x, box.y, box.w, box.h).data;
  let count = 0;
  for (let i = 3; i < data.length; i += 4) if (data[i] > 8) count += 1;
  return count;
}

test("the instruments draw a measurement rather than an empty box", function () {
  drawScopes(slopedReading());
  ["Wellenform", "Vektorskop", "Histogramm"].forEach(function (title) {
    const canvas = scopeCanvas(title);
    checkAtLeast(title + " has a buffer of its own", canvas.width, 40);
    checkAtLeast(title + " puts ink on it", inked(canvas), 60);
  });
});

// What separates a waveform from a histogram: it says *where* in the frame a tone is. A picture
// dark on the left and bright on the right has to draw low on the left and high on the right, and
// a waveform built from the histogram alone would look the same on both sides.
test("the waveform reads across the frame", function () {
  drawScopes(slopedReading());
  const canvas = scopeCanvas("Wellenform");
  const half = Math.floor(canvas.width / 2);
  const quarter = Math.floor(canvas.height / 4);
  const low = canvas.height - quarter;
  // The bottom quarter is the tones under about 64, and only the left of the frame reaches them;
  // the top quarter is over about 190, and only the right does. A trace drawn from the histogram
  // instead would put the whole spread under every column and fill all four of these.
  checkAtLeast("the dark half of the frame draws low",
    inked(canvas, { x: 0, y: low, w: half, h: quarter }), 10);
  check("and the bright half has nothing down there",
    inked(canvas, { x: half, y: low, w: half, h: quarter }), 0);
  checkAtLeast("the bright half draws high",
    inked(canvas, { x: half, y: 0, w: half, h: quarter }), 10);
  check("and the dark half has nothing up there",
    inked(canvas, { x: 0, y: 0, w: half, h: quarter }), 0);
});

// The graticule turns a cloud into a reading, and it is drawn whether or not there is anything to
// plot -- an empty vectorscope without its boxes is a black square.
test("the vectorscope keeps its graticule with nothing to plot", function () {
  drawScopes(emptyReading());
  checkAtLeast("the boxes and the circle are still there", inked(scopeCanvas("Vektorskop")), 100);
  check("and the panel says why the rest is empty",
    scopesHost.querySelector(".v-scopes__range").textContent, "Nichts zu messen");
});

// Scope and empty picture, crossed where it is drawn rather than where it is counted.
test("an empty reading draws no trace", function () {
  drawScopes(emptyReading());
  check("the waveform is blank", inked(scopeCanvas("Wellenform")), 0);
  check("and so is the histogram", inked(scopeCanvas("Histogramm")), 0);
});

test("the instruments stack rather than squeeze under a finger", function () {
  drawScopes(slopedReading(), "phone");

    .map(function (canvas) { return canvas.getBoundingClientRect(); });
  check("each instrument gets the whole width",
    boxes.every(function (box) { return Math.round(box.width) === Math.round(boxes[0].width); }),
    true);
  check("and they stand one above another", boxes[1].top > boxes[0].bottom - 1, true);
});

  const toolbar = libraryHost.querySelector(".v-library__toolbar").getBoundingClientRect();
  checkAtLeast("across the whole toolbar rather than beside the import",
    Math.round(box.width), Math.round(toolbar.width) - 24);
  checkAtMost("and its label fits inside it", button.scrollWidth, Math.ceil(box.width) + 1);
});

test("a medium says whether it has a proxy, and one without is no worse off", function () {
  drawLibrary(new Map([["med_a", "ready"], ["med_b", "building"]]), false);
  check("the one that has a proxy says so", libraryEntry("a").dataset.proxy, "ready");
  check("the one being worked on says which one it is",
    libraryEntry("b").dataset.proxy, "building");
  check("and the one with neither says nothing at all", libraryEntry("c").dataset.proxy, "none");
  // The one that is being worked on is the reason the machine is busy, so it is the one that gets
  // a colour. A ready proxy is the ordinary state and stays quiet.
  const busy = getComputedStyle(libraryEntry("b").querySelector(".v-library__proxy")).color;
  const done = getComputedStyle(libraryEntry("a").querySelector(".v-library__proxy")).color;
  check("and only the busy one is picked out in the accent", busy !== done, true);
  // The entries have to stay the same height whatever their proxy state, or a queue working
  // through a library would make the list jump under the pointer.
  check("an entry does not change size when a proxy appears",
    [Math.round(libraryEntry("a").getBoundingClientRect().height),
     Math.round(libraryEntry("c").getBoundingClientRect().height)].every(function (h, _, all) {
       return h === all[0];
     }), true);
  checkAtMost("and no entry overflows its rail",
    Math.max.apply(null, ["a", "b", "c"].map(function (id) { return libraryEntry(id).scrollWidth; })),
    libraryHost.querySelector(".v-library__list").clientWidth);
});

test("the switch shows the state it is in", function () {
  drawLibrary(new Map(), true);
  check("pressed while the preview is on the originals",

  drawLibrary(new Map(), false);
  check("and not pressed while it is on the proxies",

});
