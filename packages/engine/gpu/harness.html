<body><pre id="out">pending</pre>
<script src="./bundle.js"></script>
<script>
const MEDIA = "med_" + "a".repeat(64);

function transform(over) {
  return Object.assign({ x: 0, y: 0, scaleX: 1, scaleY: 1, rotation: 0, anchorX: 0.5,
    anchorY: 0.5, opacity: 1, crop: { left: 0, top: 0, right: 0, bottom: 0 } }, over || {});
}

function project(width, height, background, clips, sourceWidth, sourceHeight) {
  return {
    settings: { width, height, background },
    library: [{ id: MEDIA, width: sourceWidth ?? width, height: sourceHeight ?? height }],
    timeline: { tracks: [{ id: "trk_0", kind: "video", hidden: false, clips: clips.map((c, i) => ({
      id: c.id ?? ("clp_" + i), source: { kind: "media", media: MEDIA }, start: 0, duration: 1000,
      blend: c.blend ?? "normal", effects: c.effects ?? [], transitionIn: c.transitionIn,
      transform: transform(c.t) })) }] },
  };
}

function frame(w, h, pixel) {
  const bytes = new Uint8Array(w * h * 4);
  for (let i = 0; i < w * h; i += 1) bytes.set(pixel(i % w, (i / w) | 0), i * 4);
  return new VideoFrame(bytes, { format: "RGBA", codedWidth: w, codedHeight: h, timestamp: 0 });
}

function canvasOf(w, h) {
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  return canvas;
}

// readPixels hands back the rows bottom-up; this reads them the way a picture is described.
function reader(pixels, w, h) {
  return (x, y) => {
    const at = ((h - 1 - y) * w + x) * 4;
    return [pixels[at], pixels[at + 1], pixels[at + 2], pixels[at + 3]];
  };
}

function rig(w, h, background, clips, sourceWidth, sourceHeight) {
  const canvas = canvasOf(w, h);
  const context = R.createContext(canvas);
  return { canvas, context, compositor: new R.Compositor(context),
    scene: project(w, h, background, clips, sourceWidth, sourceHeight) };
}

// What the page sees, which is where a hole in the alpha channel shows up.
function overPage(canvas, pageColor, x, y) {
  const two = canvasOf(canvas.width, canvas.height).getContext("2d");
  two.fillStyle = pageColor;
  two.fillRect(0, 0, canvas.width, canvas.height);
  two.drawImage(canvas, 0, 0);
  return Array.from(two.getImageData(x, y, 1, 1).data);
}

// The resolved parameters come from the Rust core in the running application; here they are
// handed in, because what these checks are about is the pixel the value produces.
function draw(compositor, scene, at, frames, params) {
  compositor.render(scene, at, frames, params ?? new Map());
}

function floats(entries) {
  return new Map(entries.map(([id, values]) => [id,
    new Map(values.map(([key, value]) => [key, { kind: "float", value }]))]));
}

// A transition's own parameters live on the model rather than in the resolved batch, so they travel
// as ParamValue the way a project file carries them.
function params(values) {
  const out = {};
  for (const [key, value] of Object.entries(values || {})) out[key] = { kind: "float", value };
  return out;
}

const results = [];

function check(name, got, want, tolerance) {
  const slack = tolerance ?? 1;
  const list = Array.isArray(got) && Array.isArray(want);
  const ok = list
    ? got.length === want.length && got.every((v, i) => Math.abs(v - want[i]) <= slack)
    : JSON.stringify(got) === JSON.stringify(want);
  results.push({ name, ok, got, want });
}

function test(name, fn) {
  try {
    fn();
  } catch (error) {
    results.push({ name, ok: false, got: "THREW " + error.name + ": " + error.message, want: "no throw" });
  }
}

test("driver", () => {
  const { context } = rig(4, 4, "#000000", []);
  check("webgl2 present", typeof context.gl.getParameter(context.gl.VERSION), "string");
  check("shaders compile and link", (() => {
    const { compositor, scene, context: c } = rig(4, 4, "#ff0000", [{}]);
    const f = frame(4, 4, () => [0, 0, 255, 255]);
    draw(compositor, scene, 0, new Map([["clp_0", f]]));
    f.close();
    return [c.gl.getError(), ...reader(compositor.readPixels(), 4, 4)(2, 2)];
  })(), [0, 0, 0, 255, 255]);
});

test("premultiplied alpha", () => {
  const half = (clips, texel) => {
    const { compositor, scene } = rig(4, 4, "#ff0000", clips);
    const f = frame(4, 4, () => texel);
    draw(compositor, scene, 0, new Map([["clp_0", f]]));
    f.close();
    return reader(compositor.readPixels(), 4, 4)(2, 2);
  };
  check("half-transparent green over red", half([{}], [0, 255, 0, 128]), [128, 128, 0, 255]);
  check("opaque white at half opacity", half([{ t: { opacity: 0.5 } }], [255, 255, 255, 255]),
    [255, 128, 128, 255]);
  check("alpha and opacity multiply", half([{ t: { opacity: 0.5 } }], [0, 255, 0, 128]),
    [191, 64, 0, 255]);
});

test("two clips", () => {
  const { compositor, scene } = rig(4, 4, "#000000", [{ id: "clp_a" }, { id: "clp_b", t: { opacity: 0.5 } }]);
  const red = frame(4, 4, () => [255, 0, 0, 255]);
  const green = frame(4, 4, () => [0, 255, 0, 255]);
  draw(compositor, scene, 0, new Map([["clp_a", red], ["clp_b", green]]));
  red.close();
  green.close();
  check("upper clip at half opacity over lower", reader(compositor.readPixels(), 4, 4)(2, 2),
    [128, 128, 0, 255]);
});

// A blend mode that reaches the alpha channel punches a hole the page shines through.
test("blend modes keep the picture opaque", () => {
  const modes = ["normal", "multiply", "screen", "overlay", "add", "subtract", "difference",
    "lighten", "darken"];
  for (const mode of modes) {
    for (const alpha of [255, 128]) {
      const { canvas, compositor, scene } = rig(4, 4, "#804020",
        [{ id: "clp_a" }, { id: "clp_b", blend: mode, t: { opacity: alpha === 255 ? 1 : 0.5 } }]);
      const lower = frame(4, 4, () => [200, 100, 50, 255]);
      const upper = frame(4, 4, () => [100, 150, 200, alpha]);
      draw(compositor, scene, 0, new Map([["clp_a", lower], ["clp_b", upper]]));
      lower.close();
      upper.close();
      const buffer = reader(compositor.readPixels(), 4, 4)(2, 2);
      check(mode + " alpha=" + alpha + " stays opaque", buffer[3], 255);
      // With an opaque buffer the page contributes nothing, so what it shows is what was drawn.
      check(mode + " alpha=" + alpha + " lets no page through", overPage(canvas, "#ff00ff", 2, 2),
        buffer);
    }
  }
});

// The FrameCache may close a frame between the tick and the render. Uploading it would leave the
// texture on the previous frame, or -- with no previous frame -- opaque black over everything.
test("a closed frame does not black out the picture", () => {
  const { compositor, scene, context } = rig(4, 4, "#ff0000", [{}]);
  const dead = frame(4, 4, () => [0, 255, 0, 255]);
  dead.close();
  draw(compositor, scene, 0, new Map([["clp_0", dead]]));
  check("background survives a closed frame", reader(compositor.readPixels(), 4, 4)(2, 2),
    [255, 0, 0, 255]);
  check("and no driver error was left behind", context.gl.getError(), 0);
});

test("a frame the driver cannot hold is left out", () => {
  const { compositor, scene, context } = rig(4, 4, "#ff0000", [{}]);
  const huge = frame(context.maxTextureSize + 1, 1, () => [0, 255, 0, 255]);
  draw(compositor, scene, 0, new Map([["clp_0", huge]]));
  huge.close();
  check("background survives an oversize frame", reader(compositor.readPixels(), 4, 4)(2, 2),
    [255, 0, 0, 255]);
  check("and no driver error was left behind", context.gl.getError(), 0);
});

test("background with alpha", () => {
  const { canvas, compositor } = rig(4, 4, "#80808080", []);
  draw(compositor, project(4, 4, "#80808080", []), 0, new Map());
  // Half of the grey, because half of it is the black page underneath.
  check("a half-transparent background over a black page", overPage(canvas, "#000000", 1, 1),
    [64, 64, 64, 255]);
});

test("dispose is final", () => {
  const { compositor, scene, context } = rig(4, 4, "#ff0000", [{}]);
  const f = frame(4, 4, () => [0, 0, 255, 255]);
  draw(compositor, scene, 0, new Map([["clp_0", f]]));
  compositor.dispose();
  // A queued animation frame after the preview unmounted. Nothing may reach the driver, so the
  // buffer still holds the last real render -- read past the compositor to see it.
  draw(compositor, project(4, 4, "#00ff00", []), 0, new Map());
  compositor.dispose();
  f.close();
  const raw = new Uint8Array(4 * 4 * 4);
  context.gl.readPixels(0, 0, 4, 4, context.gl.RGBA, context.gl.UNSIGNED_BYTE, raw);
  check("the drawing buffer is untouched after dispose", reader(raw, 4, 4)(2, 2), [0, 0, 255, 255]);
  check("and the compositor reads nothing back", compositor.readPixels().length, 0);
});

test("geometry", () => {
  const { compositor, scene } = rig(16, 16, "#000000",
    [{ t: { rotation: 90, anchorX: 0, anchorY: 0, scaleX: 0.5, scaleY: 0.5 } }], 16, 16);
  const f = frame(16, 16, () => [255, 255, 255, 255]);
  draw(compositor, scene, 0, new Map([["clp_0", f]]));
  f.close();
  const at = reader(compositor.readPixels(), 16, 16);
  // Anchor at the source's top-left corner, which sits in the middle of the frame. A quarter turn
  // clockwise swings the picture from below-right into below-left.
  check("turns clockwise about the anchor", [at(4, 12)[0], at(12, 12)[0]], [255, 0]);

  const quad = rig(16, 16, "#000000", [{}], 16, 16);
  const corners = frame(16, 16, (x, y) => (y < 8 ? (x < 8 ? [255, 0, 0, 255] : [0, 255, 0, 255])
    : (x < 8 ? [0, 0, 255, 255] : [255, 255, 0, 255])));
  draw(quad.compositor, quad.scene, 0, new Map([["clp_0", corners]]));
  corners.close();
  const q = reader(quad.compositor.readPixels(), 16, 16);
  check("top left is red", q(4, 4), [255, 0, 0, 255]);
  check("top right is green", q(12, 4), [0, 255, 0, 255]);
  check("bottom left is blue", q(4, 12), [0, 0, 255, 255]);
  check("bottom right is yellow", q(12, 12), [255, 255, 0, 255]);
});

// Nesting on a driver. The clips a compound holds keep their own ids, so the same frames serve
// both scenes -- what changes is only where the clips are written down.
function nestedProject(w, h, background, clips, sourceWidth, sourceHeight, over) {
  const flat = project(w, h, background, clips, sourceWidth, sourceHeight);
  const group = {
    id: "clp_group", source: { kind: "compound", timeline: flat.timeline },
    start: 0, duration: 1000, inPoint: 0,
    speed: { rate: 1, reverse: false, preservePitch: true },
    blend: "normal", effects: [], volume: 1, pan: 0,
    fades: { inDuration: 0, outDuration: 0 }, keyframes: {},
    transform: transform((over && over.t) || {}),
  };
  return {
    settings: flat.settings,
    library: flat.library,
    timeline: { tracks: [{ id: "trk_outer", kind: "video", hidden: false, clips: [group] }] },
  };
}

// The whole drawing buffer, so a difference of one pixel anywhere counts -- which is what a
// matrix composed in the wrong order produces at an edge.
function buffer(w, h, scene, clips, pixel) {
  const canvas = canvasOf(w, h);
  const context = R.createContext(canvas);
  const compositor = new R.Compositor(context);
  const frames = new Map();
  for (const id of clips) frames.set(id, frame(w, h, pixel));
  draw(compositor, scene, 0, frames);
  for (const f of frames.values()) f.close();
  return Array.from(compositor.readPixels());
}

// The one claim `clip.nest` makes, and the only proof that counts for it: fold two clips into a
// compound and no pixel moves. Checking that "the compound drew something" would pass with the
// picture mirrored.
test("nesting changes no pixel", () => {
  const corners = (x, y) => (y < 8 ? (x < 8 ? [255, 0, 0, 255] : [0, 255, 0, 255])
    : (x < 8 ? [0, 0, 255, 255] : [255, 255, 0, 255]));
  const clips = [
    { id: "clp_a", t: { scaleX: 0.75, scaleY: 0.75, rotation: 20, x: -2, y: 3 } },
    { id: "clp_b", blend: "screen", t: { opacity: 0.6, scaleX: 0.5, scaleY: 0.5, x: 4, anchorX: 0.25 } },
  ];
  const ids = ["clp_a", "clp_b"];
  const flat = buffer(16, 16, project(16, 16, "#101820", clips, 16, 16), ids, corners);
  const folded = buffer(16, 16, nestedProject(16, 16, "#101820", clips, 16, 16), ids, corners);
  check("two clips folded into a compound draw the same frame", folded, flat, 0);
});

// And the counterweight: the comparison above would also pass if a compound drew nothing at all
// and the flat scene had been broken in the same way. A compound that is *not* left alone has to
// move what is inside it.
test("a compound clip carries its own placement", () => {
  const white = () => [255, 255, 255, 255];
  const half = nestedProject(16, 16, "#000000", [{ id: "clp_a" }], 16, 16,
    { t: { scaleX: 0.5, scaleY: 0.5 } });
  const at = reader(new Uint8Array(buffer(16, 16, half, ["clp_a"], white)), 16, 16);
  check("the picture is scaled into the middle", at(8, 8), [255, 255, 255, 255]);
  check("and the corner it left is background", at(1, 1), [0, 0, 0, 255]);

  const dim = nestedProject(16, 16, "#000000", [{ id: "clp_a" }], 16, 16, { t: { opacity: 0.5 } });
  const dimAt = reader(new Uint8Array(buffer(16, 16, dim, ["clp_a"], white)), 16, 16);
  check("a compound at half opacity halves what is inside it", dimAt(8, 8), [128, 128, 128, 255]);
});

const BRIGHTNESS = [{ id: "eff_1", effectType: "brightness", enabled: true, params: {}, keyframes: {} }];
const CROSSFADE = { transitionType: "crossfade", duration: 1000, alignment: "in", params: {} };

// One clip carrying brightness, rendered once. The value is what the core would have resolved for
// this moment; what is measured is the pixel it produces.
function brightened(amount, texel, over) {
  const { compositor, scene, canvas } = rig(4, 4, (over && over.background) || "#000000",
    [{ effects: BRIGHTNESS, t: (over && over.t) || {}, blend: over && over.blend }]);
  const f = frame(4, 4, () => texel);
  draw(compositor, scene, 0, new Map([["clp_0", f]]), floats([["eff_1", [["amount", amount]]]]));
  f.close();
  return { canvas, at: reader(compositor.readPixels(), 4, 4) };
}

test("brightness moves real pixels", () => {
  check("a gain of two doubles a mid grey", brightened(2, [64, 64, 64, 255]).at(2, 2),
    [128, 128, 128, 255]);
  check("a gain of one is the picture it was given", brightened(1, [64, 64, 64, 255]).at(2, 2),
    [64, 64, 64, 255]);
  check("a gain of zero is black and still opaque", brightened(0, [64, 64, 64, 255]).at(2, 2),
    [0, 0, 0, 255]);
});

// Two moments of the same clip with the value the core resolved for each: the visible change over
// time that a pair of keyframes produces. The interpolation itself is the core's, and proven there.
test("a brightness that changes over time changes the picture", () => {
  const early = brightened(0.5, [128, 128, 128, 255]).at(2, 2);
  const late = brightened(2, [128, 128, 128, 255]).at(2, 2);
  check("dark at the first keyframe", early, [64, 64, 64, 255]);
  check("bright at the second", late, [255, 255, 255, 255]);
});

// The chain carries premultiplied colour, where rgb greater than a is not a colour at all. Without
// the clamp this composites as if the clip were opaque, and a half-transparent overlay turns into
// a solid one the moment anybody brightens it.
test("brightness keeps a half-transparent clip half transparent", () => {
  const { at } = brightened(3, [255, 255, 255, 128], { background: "#ff0000" });
  check("white at half alpha over red stays half red", at(2, 2), [255, 128, 128, 255]);
});

test("brightness and opacity are two different things", () => {
  const { at } = brightened(2, [64, 64, 64, 255], { t: { opacity: 0.5 } });
  check("a doubled clip at half opacity is back where it started", at(2, 2), [64, 64, 64, 255]);
});

test("an effected clip still honours its blend mode", () => {
  const { at } = brightened(2, [32, 32, 32, 255], { blend: "add", background: "#ff0000" });
  check("added onto the background rather than over it", at(2, 2), [255, 64, 64, 255]);
});

// The crossfade the definition of done asks for: two clips overlapping in time, the incoming one
// carrying the transition. The middle of a dissolve is a measurable colour.
function dissolve(at, over) {
  const spec = over || {};
  const upper = Object.assign({ id: "clp_b", transitionIn: CROSSFADE }, spec);
  const { compositor, canvas, scene } = rig(4, 4, "#000000", [{ id: "clp_a" }, upper]);
  const red = frame(4, 4, () => [255, 0, 0, 255]);
  const blue = frame(4, 4, () => spec.upper || [0, 0, 255, 255]);
  draw(compositor, scene, at, new Map([["clp_a", red], ["clp_b", blue]]),
    floats([["eff_1", [["amount", 2]]]]));
  red.close();
  blue.close();
  return { canvas, at: reader(compositor.readPixels(), 4, 4) };
}

test("a crossfade between two clips", () => {
  check("a quarter in", dissolve(250).at(2, 2), [191, 0, 64, 255]);
  check("the middle is half of each", dissolve(500).at(2, 2), [128, 0, 128, 255]);
  check("three quarters in", dissolve(750).at(2, 2), [64, 0, 191, 255]);
  // Past its window the incoming clip is composited the ordinary way, which for an opaque clip
  // means it covers what is under it.
  const short = { transitionIn: { transitionType: "crossfade", duration: 500, alignment: "in",
    params: {} } };
  check("past the window the incoming clip stands alone", dissolve(750, short).at(2, 2),
    [0, 0, 255, 255]);
});

// Where the two axes cross: half opacity halfway through is a quarter of the way over, not a half
// that is afterwards faded.
test("a crossfade on a clip that is not fully opaque", () => {
  check("three eighths of the way over", dissolve(750, { t: { opacity: 0.5 } }).at(2, 2),
    [159, 0, 96, 255]);
});

// A dim blue that only a gain can lift: without the effect running first, the middle of this
// dissolve is [128, 0, 64].
test("a clip runs its own effects before it is mixed in", () => {
  const dim = { upper: [0, 0, 128, 255] };
  check("dissolved as it arrives", dissolve(500, dim).at(2, 2), [128, 0, 64, 255]);
  check("brightened first, then dissolved",
    dissolve(500, Object.assign({ effects: BRIGHTNESS }, dim)).at(2, 2), [128, 0, 128, 255]);
});

// A mix writes the whole frame, so a hole in the alpha channel there is a hole in the picture.
test("a crossfade leaves the picture opaque", () => {
  const shot = dissolve(500);
  check("nothing of the page comes through", overPage(shot.canvas, "#00ff00", 2, 2),
    shot.at(2, 2));
});

// Two passes in one chain, which is where the targets have to take turns: a pass that reads the
// texture it writes is a feedback loop, and no single-effect check can see it.
test("two effects in a row each do their bit", () => {
  const twice = [
    { id: "eff_1", effectType: "brightness", enabled: true, params: {}, keyframes: {} },
    { id: "eff_2", effectType: "brightness", enabled: true, params: {}, keyframes: {} },
  ];
  const { compositor, scene } = rig(4, 4, "#000000", [{ effects: twice }]);
  const f = frame(4, 4, () => [32, 32, 32, 255]);
  draw(compositor, scene, 0, new Map([["clp_0", f]]),
    floats([["eff_1", [["amount", 2]]], ["eff_2", [["amount", 2]]]]));
  f.close();
  check("a gain of two applied twice", reader(compositor.readPixels(), 4, 4)(2, 2),
    [128, 128, 128, 255]);
});

// The intermediate target outlives the frame it was drawn for. A clip that no longer covers the
// whole frame would otherwise be composited together with what the last frame left in there.
test("an intermediate target does not carry the last frame over", () => {
  const { compositor, context } = rig(8, 8, "#ff0000", [{ effects: BRIGHTNESS }]);
  const white = frame(8, 8, () => [255, 255, 255, 255]);
  const full = project(8, 8, "#ff0000", [{ effects: BRIGHTNESS }]);
  const small = project(8, 8, "#ff0000", [{ effects: BRIGHTNESS, t: { scaleX: 0.5, scaleY: 0.5 } }]);
  draw(compositor, full, 0, new Map([["clp_0", white]]), floats([["eff_1", [["amount", 1]]]]));
  draw(compositor, small, 0, new Map([["clp_0", white]]), floats([["eff_1", [["amount", 1]]]]));
  white.close();
  const at = reader(compositor.readPixels(), 8, 8);
  check("the corner is background again", at(0, 0), [255, 0, 0, 255]);
  check("and the clip is where it belongs", at(4, 4), [255, 255, 255, 255]);
  check("with no driver error", context.gl.getError(), 0);
});

// devicePixelRatio changes the drawing buffer without anyone calling resize. A target left at the
// old size keeps a quarter of the picture and stretches it over the whole frame.
test("an intermediate target follows the drawing buffer", () => {
  const { canvas, compositor } = rig(8, 8, "#000000", [{ effects: BRIGHTNESS }]);
  const small = frame(8, 8, () => [255, 255, 255, 255]);
  draw(compositor, project(8, 8, "#000000", [{ effects: BRIGHTNESS }]), 0,
    new Map([["clp_0", small]]), floats([["eff_1", [["amount", 1]]]]));
  small.close();
  canvas.width = 16;
  canvas.height = 16;
  const corners = frame(16, 16, (x, y) => (y < 8 ? (x < 8 ? [255, 0, 0, 255] : [0, 255, 0, 255])
    : (x < 8 ? [0, 0, 255, 255] : [255, 255, 0, 255])));
  draw(compositor, project(16, 16, "#000000", [{ effects: BRIGHTNESS }], 16, 16), 0,
    new Map([["clp_0", corners]]), floats([["eff_1", [["amount", 1]]]]));
  corners.close();
  const at = reader(compositor.readPixels(), 16, 16);
  check("top left through the chain is red", at(4, 4), [255, 0, 0, 255]);
  check("bottom right through the chain is yellow", at(12, 12), [255, 255, 0, 255]);
});

test("the effect chain leaves no driver error behind", () => {
  const { context, compositor, scene } = rig(4, 4, "#000000",
    [{ id: "clp_a" }, { id: "clp_b", effects: BRIGHTNESS, transitionIn: CROSSFADE }]);
  const a = frame(4, 4, () => [255, 0, 0, 255]);
  const b = frame(4, 4, () => [0, 0, 255, 255]);
  draw(compositor, scene, 500, new Map([["clp_a", a], ["clp_b", b]]),
    floats([["eff_1", [["amount", 2]]]]));
  a.close();
  b.close();
  check("glGetError after a chain and a mix", context.gl.getError(), 0);
});

// One clip carrying one effect, rendered once. `values` is what the core resolved for this moment;
// what every check below measures is the pixel that value produces.
function through(type, values, pixel, over) {
  const spec = over || {};
  const size = spec.size || 4;
  const effects = [{ id: "eff_1", effectType: type, enabled: true, params: {}, keyframes: {} }];
  const { canvas, compositor, scene } = rig(size, size, spec.background || "#000000",
    [{ effects, t: spec.t || {}, blend: spec.blend }], size, size);
  const f = frame(size, size, typeof pixel === "function" ? pixel : () => pixel);
  draw(compositor, scene, 0, new Map([["clp_0", f]]), floats([["eff_1", Object.entries(values)]]));
  f.close();
  return { canvas, at: reader(compositor.readPixels(), size, size) };
}

test("contrast pivots about mid grey", () => {
  check("a slope of two on a light grey", through("contrast", { amount: 2 }, [160, 160, 160, 255])
    .at(2, 2), [192, 192, 192, 255]);
  check("a slope of one is the picture it was given",
    through("contrast", { amount: 1 }, [160, 160, 160, 255]).at(2, 2), [160, 160, 160, 255]);
  check("a slope of zero is the pivot itself",
    through("contrast", { amount: 0 }, [160, 160, 160, 255]).at(2, 2), [128, 128, 128, 255]);
});

// The one shader here that has to undo the premultiplication, and the only way to see whether it
// did. Working on the premultiplied value gives 33 instead of 97 -- a difference no assertion about
// the shader's text could tell apart.
test("contrast reads the colour, not the colour times its alpha", () => {
  check("a half-transparent grey pushed about its own mid point",
    through("contrast", { amount: 2 }, [160, 160, 160, 128]).at(2, 2), [97, 97, 97, 255]);
});

test("saturation mixes towards luma", () => {
  const dull = [200, 100, 100, 255];
  check("zero is black and white", through("saturation", { amount: 0 }, dull).at(2, 2),
    [121, 121, 121, 255]);
  check("one is the picture it was given", through("saturation", { amount: 1 }, dull).at(2, 2), dull);
  check("one and a half pushes past it", through("saturation", { amount: 1.5 }, dull).at(2, 2),
    [239, 89, 89, 255]);
});

// Mixing towards grey is linear in the channel values, so premultiplied is already the right space.
// The proof is that a half-transparent red desaturates to the same grey an opaque one would, times
// its alpha -- 27, not 54.
test("saturation leaves a half-transparent clip half transparent", () => {
  check("a half-transparent red gone monochrome",
    through("saturation", { amount: 0 }, [255, 0, 0, 128]).at(2, 2), [27, 27, 27, 255]);
});

// Where a clamp to alpha is the only thing that clamps. Pushing an *opaque* channel past 1 costs
// nothing to get wrong -- the RGBA8 target clamps it on the way in -- so an over-saturated opaque
// pixel proves nothing about the clamp. Over alpha and under 1 is the gap the hardware leaves, and
// without the clamp this half-transparent red comes back at 229 instead of 128.
test("saturation past one cannot push a channel past its own alpha", () => {
  check("a half-transparent red pushed hard",
    through("saturation", { amount: 2 }, [255, 0, 0, 128]).at(2, 2), [128, 0, 0, 255]);
});

test("a desaturated clip still honours its blend mode", () => {
  check("grey added onto a red background",
    through("saturation", { amount: 0 }, [200, 100, 100, 255],
      { blend: "add", background: "#ff0000" }).at(2, 2), [255, 121, 121, 255]);
});

test("colour temperature trades red against blue", () => {
  const grey = [128, 128, 128, 255];
  check("warm", through("temperature", { amount: 0.5 }, grey).at(2, 2), [192, 128, 64, 255]);
  check("cold", through("temperature", { amount: -0.5 }, grey).at(2, 2), [64, 128, 192, 255]);
  check("neutral is the picture it was given",
    through("temperature", { amount: 0 }, grey).at(2, 2), grey);
  // Red lands at 1.57 here, and the RGBA8 target would have clamped that on its own -- so this says
  // the effect runs, not that it clamps.
  check("a channel driven past one comes back at one",
    through("temperature", { amount: 1 }, [200, 200, 200, 255]).at(2, 2), [255, 200, 0, 255]);
  // Past alpha but under one is the gap the hardware leaves open, and the only place the clamp is the
  // thing being measured: without it this comes back at 201 rather than 128.
  check("and a channel driven past its own alpha stops at that",
    through("temperature", { amount: 1 }, [200, 200, 200, 128]).at(2, 2), [128, 100, 0, 255]);
});

test("a vignette darkens the corners and not the middle", () => {
  const white = [255, 255, 255, 255];
  const strong = through("vignette", { amount: 1, size: 0.6 }, white, { size: 16 });
  check("the middle is untouched", strong.at(8, 8), white);
  check("the corner is nearly gone", strong.at(0, 0), [8, 8, 8, 255], 2);
  check("and at strength zero the corner is untouched too",
    through("vignette", { amount: 0, size: 0.6 }, white, { size: 16 }).at(0, 0), white);
});

// Over an opaque background a vignette that eats alpha as well as colour is indistinguishable from
// one that does not -- both come back at 8. Over a coloured one it is the difference between a dark
// corner and a corner that has become a window: 8 against 255.
test("a vignette darkens the picture rather than dissolving it", () => {
  const over = { size: 16, background: "#ff0000" };
  const shot = through("vignette", { amount: 1, size: 0.6 }, [255, 255, 255, 255], over);
  check("the darkened corner is dark, not the background showing through", shot.at(0, 0),
    [8, 8, 8, 255], 2);
});

// A single bright column, blurred. The horizontal sweep spreads it and the vertical one cannot,
// because a full-height column is already uniform down the frame -- so these numbers are the
// horizontal sweep on its own, weight by weight.
const COLUMN = (x) => (x === 8 ? [255, 255, 255, 255] : [0, 0, 0, 255]);
const ROW = (x, y) => (y === 8 ? [255, 255, 255, 255] : [0, 0, 0, 255]);

test("a blur spreads a line along both axes", () => {
  const across = through("blur", { amount: 1, pass: 0 }, COLUMN, { size: 16 });
  check("the middle keeps the centre weight", across.at(8, 8), [58, 58, 58, 255]);
  check("one pixel out", across.at(9, 8), [50, 50, 50, 255]);
  check("two pixels out", across.at(10, 8), [31, 31, 31, 255]);
  check("four pixels out", across.at(12, 8), [4, 4, 4, 255]);
  check("and five is past the kernel", across.at(13, 8), [0, 0, 0, 255]);
});

// The same kernel turned ninety degrees. Without `u_pass` both sweeps run along one axis, and a
// full-width row blurred horizontally comes back exactly as it went in -- which is why this check
// and the one above are two checks rather than one.
test("the second sweep of a blur runs down the frame", () => {
  const down = through("blur", { amount: 1 }, ROW, { size: 16 });
  check("the middle keeps the centre weight", down.at(8, 8), [58, 58, 58, 255]);
  check("one pixel down", down.at(8, 9), [50, 50, 50, 255]);
  check("two pixels down", down.at(8, 10), [31, 31, 31, 255]);
  check("and five is past the kernel", down.at(8, 13), [0, 0, 0, 255]);
});

test("a blur of nothing is the picture it was given", () => {
  const none = through("blur", { amount: 0 }, COLUMN, { size: 16 });
  check("the line is still a line", none.at(8, 8), [255, 255, 255, 255]);
  check("and its neighbour is still black", none.at(9, 8), [0, 0, 0, 255]);
});

// Two frames through one compositor, which is where a chain that feeds its own output back shows up.
// Every other check here builds a fresh compositor and renders once, and a second-frame fault is
// invisible to all of them.
test("a blur does not pile up over two frames", () => {
  const effects = [{ id: "eff_1", effectType: "blur", enabled: true, params: {}, keyframes: {} }];
  const { compositor, scene } = rig(16, 16, "#000000", [{ effects }], 16, 16);
  const shot = (amount) => {
    const f = frame(16, 16, COLUMN);
    draw(compositor, scene, 0, new Map([["clp_0", f]]), floats([["eff_1", [["amount", amount]]]]));
    f.close();
    return reader(compositor.readPixels(), 16, 16)(9, 8);
  };
  const first = shot(1);
  check("the same blur twice is the same picture twice", shot(1), first);
  check("and a blur turned off comes back sharp", shot(0), [0, 0, 0, 255]);
});

// A soft edge between two greys. Away from it nothing may move, or the effect is a gain with extra
// steps; at it the two sides pull apart.
const EDGE = (x) => (x < 8 ? [102, 102, 102, 255] : [153, 153, 153, 255]);

test("sharpening pulls an edge apart and leaves flat areas alone", () => {
  const sharp = through("sharpen", { amount: 2 }, EDGE, { size: 16 });
  check("the flat side is untouched", sharp.at(4, 8), [102, 102, 102, 255]);
  check("the dark side of the edge goes darker", sharp.at(7, 8), [77, 77, 77, 255]);
  check("the light side goes lighter", sharp.at(8, 8), [178, 178, 178, 255]);
  const off = through("sharpen", { amount: 0 }, EDGE, { size: 16 });
  check("and at zero the edge is where it was", [off.at(7, 8)[0], off.at(8, 8)[0]], [102, 153]);
});

test("a chroma key cuts the keyed hue out and leaves the rest", () => {
  const keyed = { hue: 120, tolerance: 25, softness: 15 };
  check("green over red is red", through("chromaKey", keyed, [0, 255, 0, 255],
    { background: "#ff0000" }).at(2, 2), [255, 0, 0, 255]);
  check("blue is a hundred and twenty degrees away and stays",
    through("chromaKey", keyed, [0, 0, 255, 255], { background: "#ff0000" }).at(2, 2),
    [0, 0, 255, 255]);
});

// A grey has no hue to speak of, and the arithmetic hands back zero for it. Without the floor on
// saturation a key set to red therefore erases every grey in the picture.
test("a chroma key spares a grey whose nominal hue matches", () => {
  check("mid grey survives a key set to red",
    through("chromaKey", { hue: 0, tolerance: 25, softness: 15 }, [128, 128, 128, 255],
      { background: "#ff0000" }).at(2, 2), [128, 128, 128, 255]);
});

test("a chroma key falls off rather than cutting", () => {
  // Ten degrees into a fifteen degree falloff: the pixel keeps three quarters of itself, alpha and
  // colour together.
  check("a hue just outside the tolerance is partly kept",
    through("chromaKey", { hue: 155, tolerance: 25, softness: 15 }, [0, 255, 0, 255]).at(2, 2),
    [0, 189, 0, 255]);
});

// Effect and keyframe, crossed on one compositor: two moments of the same clip with the value the
// core resolved for each. The interpolation is the core's and is proven there; that a changing value
// changes the picture is only provable here.
test("a contrast that changes over time changes the picture", () => {
  const effects = [{ id: "eff_1", effectType: "contrast", enabled: true, params: {}, keyframes: {} }];
  const { compositor, scene } = rig(4, 4, "#000000", [{ effects }], 4, 4);
  const shot = (amount) => {
    const f = frame(4, 4, () => [160, 160, 160, 255]);
    draw(compositor, scene, 0, new Map([["clp_0", f]]), floats([["eff_1", [["amount", amount]]]]));
    f.close();
    return reader(compositor.readPixels(), 4, 4)(2, 2);
  };
  check("flat at the first keyframe", shot(0), [128, 128, 128, 255]);
  check("and separated at the second", shot(2), [192, 192, 192, 255]);
});

// Two clips overlapping in time, the incoming one carrying the transition. Both pictures are split
// down the middle, which is what tells a transition that *moves* them from one that only reveals.
function crossing(type, at, over) {
  const spec = over || {};
  const size = spec.size || 16;
  const upper = {
    id: "clp_b",
    t: spec.t || {},
    effects: spec.effects,
    transitionIn: { transitionType: type, duration: 1000, alignment: "in",
      params: params(spec.params) },
  };
  const { canvas, compositor, scene } = rig(size, size, spec.background || "#000000",
    [{ id: "clp_a" }, upper], size, size);
  const lower = frame(size, size, spec.lower || (() => [255, 0, 0, 255]));
  const incoming = frame(size, size, spec.upper || (() => [0, 0, 255, 255]));
  draw(compositor, scene, at, new Map([["clp_a", lower], ["clp_b", incoming]]),
    floats([["eff_1", [["amount", 2]]]]));
  lower.close();
  incoming.close();
  return { canvas, at: reader(compositor.readPixels(), size, size) };
}

const RED = [255, 0, 0, 255];
const YELLOW = [255, 255, 0, 255];
const GREEN = [0, 255, 0, 255];
const BLUE = [0, 0, 255, 255];
const SPLIT = { lower: (x) => (x < 8 ? RED : YELLOW), upper: (x) => (x < 8 ? GREEN : BLUE) };

test("a wipe uncovers the incoming clip without moving it", () => {
  const half = crossing("wipe", 500, Object.assign({ params: { softness: 0 } }, SPLIT));
  check("the uncovered side shows the incoming clip where it belongs", half.at(4, 8), GREEN);
  check("the covered side still shows the outgoing one where it belongs", half.at(12, 8), YELLOW);
});

// A soft edge has width, so it has to travel further than the frame is wide or its trailing side never
// leaves: a band of the outgoing clip would sit at the far edge for the whole of the wipe. Invisible
// at softness zero, which is what every other wipe check here uses.
test("a soft wipe carries its trailing edge off the frame", () => {
  const late = crossing("wipe", 900, { params: { softness: 0.2 } });
  check("the far edge is mostly the incoming clip by then", late.at(15, 8), [106, 0, 149, 255], 4);
});

test("a wipe at ninety degrees comes down the frame", () => {
  const down = crossing("wipe", 500,
    Object.assign({ params: { angle: 90, softness: 0 } }, SPLIT));
  check("the top is the incoming clip", down.at(4, 4), GREEN);
  check("the bottom is still the outgoing one", down.at(4, 12), RED);
});

// The two axes crossed: a half-opaque clip halfway through is a quarter wiped, so the edge stands at
// a quarter of the frame rather than at half of it with everything faded.
test("a wipe on a clip that is not fully opaque", () => {
  const soft = crossing("wipe", 500,
    Object.assign({ t: { opacity: 0.5 }, params: { softness: 0 } }, SPLIT));
  // At full progress the edge would stand at half the frame, so x=6 is what tells the two apart.
  check("before the quarter mark the incoming clip is already there", soft.at(2, 8), GREEN);
  check("and after it the outgoing one still is", soft.at(6, 8), RED);
  check("with the outgoing clip still unmoved", soft.at(12, 8), YELLOW);
});

// Same moment, same pictures, same direction as the wipe -- and every pixel is a different one,
// because here both pictures travel.
test("a slide pushes both pictures along", () => {
  const half = crossing("slide", 500, SPLIT);
  check("the incoming clip leads with its far edge", half.at(4, 8), BLUE);
  check("and the outgoing one has been shoved off the far side", half.at(12, 8), RED);
});

test("a zoom grows the incoming clip out of the middle", () => {
  const early = crossing("zoom", 100);
  check("outside the shrunken picture the outgoing clip is untouched", early.at(3, 8), RED);
  check("inside it the two are together", early.at(8, 8), [230, 0, 26, 255]);
  const half = crossing("zoom", 500);
  check("halfway through, half of each", half.at(8, 8), [128, 0, 128, 255]);
});

// Where a mix would have cost the frame its alpha: outside the shrunken picture there is no incoming
// colour, and weighting both sides would have halved the opacity of what was already there.
test("a zoom leaves the frame opaque where the incoming clip is absent", () => {
  const early = crossing("zoom", 100);
  check("the corner is still fully opaque", early.at(0, 0)[3], 255);
  check("and no page comes through it", overPage(early.canvas, "#00ff00", 0, 0), early.at(0, 0));
});

test("a dip goes out through a colour and back", () => {
  check("a quarter in, the outgoing clip is halfway down", crossing("dip", 250).at(2, 2),
    [128, 0, 0, 255]);
  check("the middle is the dip colour and nothing else", crossing("dip", 500).at(2, 2),
    [0, 0, 0, 255]);
  check("three quarters in, the incoming clip is halfway up", crossing("dip", 750).at(2, 2),
    [0, 0, 128, 255]);
  check("and the level chooses the colour",
    crossing("dip", 500, { params: { level: 1 } }).at(2, 2), [255, 255, 255, 255]);
});

// Effect and transition crossed on a transition that is not the cross dissolve: the incoming clip's
// own chain runs before the wipe uncovers it, so what appears is the contrasted grey, not the grey.
test("a clip runs its own effects before a wipe uncovers it", () => {
  const grey = () => [160, 160, 160, 255];
  const plain = crossing("wipe", 500, { upper: grey, params: { softness: 0 } });
  check("uncovered as it arrives", plain.at(4, 8), [160, 160, 160, 255]);
  const contrasted = crossing("wipe", 500, {
    upper: grey,
    params: { softness: 0 },
    effects: [{ id: "eff_1", effectType: "contrast", enabled: true, params: {}, keyframes: {} }],
  });
  check("pushed first, then uncovered", contrasted.at(4, 8), [192, 192, 192, 255]);
});

// Every transition writes the whole frame, so a hole in the alpha channel there is a hole in the
// picture. Checked for all of them rather than for the one that was written first.
test("no transition lets the page through", () => {
  for (const type of ["crossfade", "wipe", "slide", "zoom", "dip"]) {
    const shot = crossing(type, 500);
    check(type + " stays opaque", shot.at(8, 8)[3], 255);
    check(type + " lets no page through", overPage(shot.canvas, "#ff00ff", 8, 8), shot.at(8, 8));
  }
});

// A generator has no decoder, so its picture is painted rather than fetched. These checks drive the
// same GeneratorFrames the preview and the export both use, and read the pixels it produced.
function generated(generator, over) {
  const spec = over || {};
  const size = spec.size || 32;
  const scene = project(size, size, spec.background || "#ff0000", []);
  scene.timeline.tracks[0] = { id: "trk_0", kind: "video", hidden: false, clips: [{
    id: "clp_0", source: { kind: "generator", generator }, start: 0,
    duration: spec.duration || 1000, blend: "normal", effects: [],
    transform: transform(spec.t) }] };
  const canvas = canvasOf(size, size);
  const context = R.createContext(canvas);
  const compositor = new R.Compositor(context);
  const frames = new R.GeneratorFrames();
  const at = spec.at || 0;
  const pictures = frames.pictures(scene, new Set(["clp_0"]));
  compositor.render(scene, at, pictures, new Map());
  const pixels = compositor.readPixels();
  frames.close();
  return { canvas, frames, scene, compositor, at: reader(pixels, size, size) };
}

test("a solid generator paints the frame", () => {
  check("an opaque solid covers the background",
    generated({ type: "solid", color: "#0000ff" }).at(16, 16), [0, 0, 255, 255]);
  check("a colour the format cannot read falls back to black rather than to nothing",
    generated({ type: "solid", color: "rgb(0 255 0)" }).at(16, 16), [0, 0, 0, 255]);
});

// A canvas holds straight alpha and the compositor's clip shader premultiplies on the way into the
// chain. If a canvas-painted frame arrived already multiplied it would be multiplied twice, and a
// half-transparent solid over red would come back at 64 rather than 128.
test("a painted frame goes through the premultiplication once", () => {
  check("a half-transparent green solid over red",
    generated({ type: "solid", color: "#00ff0080" }).at(16, 16), [128, 128, 0, 255]);
});

// `check` only honours a tolerance between two arrays, so a single number that is allowed to wobble
// travels as an array of one.
function near(value) {
  return [value];
}

test("a gradient runs across the frame at its own angle", () => {
  const across = generated({ type: "gradient", from: "#000000", to: "#ffffff", angle: 0 });
  check("dark at the left edge", near(across.at(0, 16)[0]), near(4), 6);
  check("mid in the middle", near(across.at(16, 16)[0]), near(132), 6);
  check("light at the right edge", near(across.at(31, 16)[0]), near(251), 6);
  check("and flat down the frame", near(across.at(16, 2)[0]), near(across.at(16, 29)[0]), 2);

  const down = generated({ type: "gradient", from: "#000000", to: "#ffffff", angle: 90 });
  check("ninety degrees runs down the picture, not up it",
    [down.at(16, 2)[0] < down.at(16, 29)[0], down.at(2, 16)[0]], [true, down.at(29, 16)[0]]);
});

// The title itself. Nothing here asserts a glyph shape -- what is measured is that a title puts ink
// where its style says and leaves the rest of the frame alone, which is the whole of "text became
// pixels".
const TITLE = { type: "text", content: "III", style: { color: "#ffffff", fontSize: 0.5,
  background: "", animateIn: "none" } };

function inked(shot, size) {
  let lit = 0;
  for (let y = 0; y < size; y += 1) {
    for (let x = 0; x < size; x += 1) if (shot.at(x, y)[1] > 40) lit += 1;
  }
  return lit;
}

// How much ink, rather than how many pixels carry any. Opacity scales the one and barely touches
// the other.
function energy(shot, size) {
  let total = 0;
  for (let y = 0; y < size; y += 1) {
    for (let x = 0; x < size; x += 1) total += shot.at(x, y)[1];
  }
  return total;
}

test("a text generator puts ink on the frame", () => {
  const shot = generated(TITLE);
  const lit = inked(shot, 32);
  check("there is ink", lit > 0, true);
  check("and it is not the whole frame", lit < 32 * 32, true);
  check("the corner is still background", shot.at(0, 0), [255, 0, 0, 255]);
});

test("an empty title paints nothing at all", () => {
  const blank = generated({ type: "text", content: "   ", style: {} });
  check("no ink anywhere", inked(blank, 32), 0);
  check("and the background is untouched", blank.at(16, 16), [255, 0, 0, 255]);
});

// Every measurement in a text style is a fraction of the frame, so the same style rasterises to the
// same picture at any output size. A pixel-valued font size would shrink the title as the export grew.
test("a title keeps its proportions when the frame changes size", () => {
  const small = generated(TITLE, { size: 32 });
  const large = generated(TITLE, { size: 64 });
  const share = (shot, size) => inked(shot, size) / (size * size);
  check("the same share of the frame is inked", near(share(large, 64)), near(share(small, 32)), 0.03);
});

test("a title moves where its style puts it", () => {
  const styled = (over) => generated({ type: "text", content: "III",
    style: Object.assign({}, TITLE.style, over) });
  const high = styled({ y: 0.2 });
  const low = styled({ y: 0.8 });
  check("high on the frame leaves the bottom clear", inked(low, 32) > 0, true);
  check("and low leaves the top clear",
    [high.at(16, 28)[1] > 40, low.at(16, 4)[1] > 40], [false, false]);
});

// How much of the background is still showing. Counting is what makes this robust against where a
// glyph happens to fall: the box's job is to hide the picture behind the title, not to be blue at one
// particular pixel.
function background(shot, size) {
  let seen = 0;
  for (let y = 0; y < size; y += 1) {
    for (let x = 0; x < size; x += 1) {
      const p = shot.at(x, y);
      if (p[0] > 200 && p[1] < 40 && p[2] < 40) seen += 1;
    }
  }
  return seen;
}

test("a title's background box covers what is behind it", () => {
  const style = { color: "#ffffff", fontSize: 0.3, padding: 0.5 };
  const bare = generated({ type: "text", content: "III", style });
  const boxed = generated({ type: "text", content: "III",
    style: Object.assign({ background: "#0000ff" }, style) });
  check("the box hides a good deal of what was behind it",
    background(boxed, 32) < background(bare, 32) - 50, true);
  check("but not the whole frame", background(boxed, 32) > 0, true);
  check("and the corner of the frame is still background", boxed.at(0, 0), [255, 0, 0, 255]);
});

// The claim the whole design rests on: what animates a title is its transform, not its glyphs. So a
// faded title is the same ink at a lower opacity, and the cache underneath it never repaints.
test("a title fades through its transform", () => {
  const fading = { type: "text", content: "III",
    style: { color: "#ffffff", fontSize: 0.5, animateIn: "fade", animateInSeconds: 1 } };
  const SECOND = 705600000;
  const over = { duration: 4 * SECOND, background: "#000000" };
  const full = generated(fading, Object.assign({ at: SECOND }, over));
  const half = generated(fading, Object.assign({ at: SECOND / 2 }, over));
  check("some ink at full opacity", inked(full, 32) > 0, true);
  // A fade halves how bright the ink is, not how much of it there is -- counting lit pixels sees
  // almost no difference, which is a check that would have passed with the fade wired to nothing.
  check("halfway through the fade is half the ink",
    near(2 * energy(half, 32)), near(energy(full, 32)), energy(full, 32) * 0.05);
});

// One clip, two moments, one cache: the second moment must not repaint and must not hand back a
// closed frame. A frame closed under the compositor uploads as an error nothing throws on.
test("a generator's picture survives a second frame", () => {
  const scene = project(32, 32, "#ff0000", []);
  scene.timeline.tracks[0] = { id: "trk_0", kind: "video", hidden: false, clips: [{
    id: "clp_0", source: { kind: "generator", generator: { type: "solid", color: "#0000ff" } },
    start: 0, duration: 10000, blend: "normal", effects: [], transform: transform() }] };
  const context = R.createContext(canvasOf(32, 32));
  const compositor = new R.Compositor(context);
  const frames = new R.GeneratorFrames();
  const shot = (at) => {
    compositor.render(scene, at, frames.pictures(scene, new Set(["clp_0"])), new Map());
    return reader(compositor.readPixels(), 32, 32)(16, 16);
  };
  check("the first frame is the solid", shot(0), [0, 0, 255, 255]);
  check("and so is the second", shot(500), [0, 0, 255, 255]);
  check("with the same picture handed back rather than a new one",
    frames.pictures(scene, new Set(["clp_0"])).get("clp_0"),
    frames.pictures(scene, new Set(["clp_0"])).get("clp_0"));
  check("and no driver error", context.gl.getError(), 0);
  frames.close();
});

// The other half of caching by what was painted: an edit has to reach the screen. Keyed by the clip
// alone, a title would keep the words it was created with for as long as it stayed visible.
test("an edited title is painted again", () => {
  const scene = project(32, 32, "#ff0000", []);
  const generator = { type: "text", content: "III", style: { color: "#ffffff", fontSize: 0.5 } };
  scene.timeline.tracks[0] = { id: "trk_0", kind: "video", hidden: false, clips: [{
    id: "clp_0", source: { kind: "generator", generator }, start: 0, duration: 1000,
    blend: "normal", effects: [], transform: transform() }] };
  const frames = new R.GeneratorFrames();
  const before = frames.pictures(scene, new Set(["clp_0"])).get("clp_0");
  generator.content = "IIIIIIII";
  const after = frames.pictures(scene, new Set(["clp_0"])).get("clp_0");
  check("a different picture came back", before === after, false);
  check("and the one it replaced was closed", before.format, null);
  frames.close();
});

// Wrapping, measured as the height of the block rather than as a line count: a title that ignores its
// own width is one long line, and one long line is one line tall.
function tallness(shot, size) {
  let top = size;
  let bottom = -1;
  for (let y = 0; y < size; y += 1) {
    for (let x = 0; x < size; x += 1) {
      if (shot.at(x, y)[1] <= 40) continue;
      top = Math.min(top, y);
      bottom = Math.max(bottom, y);
    }
  }
  return bottom - top;
}

test("a title wraps to the width its style allows", () => {
  const style = { color: "#ffffff", fontSize: 0.16, maxWidth: 0.9 };
  const wide = generated({ type: "text", content: "IIII IIII IIII", style });
  const narrow = generated({ type: "text", content: "IIII IIII IIII",
    style: Object.assign({}, style, { maxWidth: 0.25 }) });
  check("the narrow one is taller than the wide one",
    tallness(narrow, 32) > tallness(wide, 32) + 4, true);
  check("and a hard break breaks even inside the width",
    tallness(generated({ type: "text", content: "IIII\nIIII", style }), 32) >
      tallness(generated({ type: "text", content: "IIII IIII", style }), 32) + 4, true);
});

// A clip that has left the screen keeps a full-frame picture alive otherwise, and one scrub through a
// timeline of titles would hold one for every one of them.
test("a generator's picture is let go when its clip leaves the screen", () => {
  const scene = project(32, 32, "#ff0000", []);
  scene.timeline.tracks[0] = { id: "trk_0", kind: "video", hidden: false, clips: [{
    id: "clp_0", source: { kind: "generator", generator: { type: "solid", color: "#0000ff" } },
    start: 0, duration: 1000, blend: "normal", effects: [], transform: transform() }] };
  const frames = new R.GeneratorFrames();
  const held = frames.pictures(scene, new Set(["clp_0"])).get("clp_0");
  frames.pictures(scene, new Set());
  // `format` is null on a closed frame and stays defined there, which is what makes it the probe.
  check("the frame it was holding is closed", held.format, null);
  frames.close();
});

test("a canvas resized behind our back", () => {
  const { canvas, compositor } = rig(8, 8, "#ff0000", [{}]);
  canvas.width = 16;
  canvas.height = 16;
  const f = frame(8, 8, () => [0, 0, 255, 255]);
  draw(compositor, project(16, 16, "#ff0000", [{}], 16, 16), 0, new Map([["clp_0", f]]));
  f.close();
  const pixels = compositor.readPixels();
  check("the viewport follows the drawing buffer", pixels.length, 16 * 16 * 4);
  check("and covers the whole of it", reader(pixels, 16, 16)(15, 0), [0, 0, 255, 255]);
});

test("offscreen canvas", () => {
  const context = R.createContext(new OffscreenCanvas(4, 4));
  const compositor = new R.Compositor(context);
  const f = frame(4, 4, () => [0, 0, 255, 255]);
  draw(compositor, project(4, 4, "#ff0000", [{}]), 0, new Map([["clp_0", f]]));
  f.close();
  check("the export worker's canvas renders the same picture",
    reader(compositor.readPixels(), 4, 4)(2, 2), [0, 0, 255, 255]);
});

// The one thing a phone does routinely. Everything below rebuilds lazily, so the proof is a
// correct pixel after the context comes back.
const lossCanvas = canvasOf(4, 4);
const lossContext = R.createContext(lossCanvas);
const lossCompositor = new R.Compositor(lossContext);
const lossScene = project(4, 4, "#000000", [{}]);
const blue = () => frame(4, 4, () => [0, 0, 255, 255]);
let prevented = null;
let lostSeen = 0;
let restoredSeen = 0;
lossContext.onLost(() => { lostSeen += 1; });
lossContext.onRestored(() => { restoredSeen += 1; });
lossCanvas.addEventListener("webglcontextlost", (e) => { prevented = e.defaultPrevented; });
const first = blue();
draw(lossCompositor, lossScene, 0, new Map([["clp_0", first]]));
first.close();
const lose = lossContext.gl.getExtension("WEBGL_lose_context");
lose.loseContext();
setTimeout(() => {
  check("the loss event is cancelled so the browser will restore", prevented, true);
  check("the loss reaches its listener", lostSeen, 1);
  const during = blue();
  draw(lossCompositor, lossScene, 0, new Map([["clp_0", during]]));
  during.close();
  lose.restoreContext();
  setTimeout(() => {
    check("the restoration reaches its listener", restoredSeen, 1);
    const after = blue();
    draw(lossCompositor, lossScene, 0, new Map([["clp_0", after]]));
    after.close();
    check("and the picture is back", reader(lossCompositor.readPixels(), 4, 4)(2, 2),
      [0, 0, 255, 255]);
    check("with no driver error", lossContext.gl.getError(), 0);
    playbackChecks().then(() => {
      document.getElementById("out").textContent = JSON.stringify(results);
    });
  }, 300);
}, 200);

// Task 10. Playback promises two things a driver is the only witness to: a clip whose next frame
// is late keeps the picture it had, and the frames it gathers are still alive when they reach
// texImage2D. A closed frame uploads as INVALID_OPERATION that nothing throws on.
function playbackScene(clips) {
  return {
    settings: { width: 4, height: 4, background: "#ff0000",
      fps: { numerator: 30, denominator: 1 } },
    library: [{ id: MEDIA, width: 4, height: 4 }],
    timeline: { tracks: [{ id: "trk_0", kind: "video", hidden: false, clips: clips.map((id) => ({
      id, source: { kind: "media", media: MEDIA }, start: 0, duration: 1000, inPoint: 0,
      blend: "normal", effects: [], speed: { rate: 1, reverse: false }, volume: 1, pan: 0,
      fades: { inDuration: 0, outDuration: 0 }, transform: transform() })) }] },
    master: { volume: 1, effects: [] },
  };
}

function solid(color) {
  return frame(4, 4, () => color);
}

// A one-entry cache, which is exactly what the FrameCache is allowed to be: handing out the next
// frame kills the one before it. Playback may not still be holding that one when it renders.
function evictingSource(colors) {
  let index = 0;
  let live = null;
  return {
    open: async () => undefined,
    frameAt: async () => {
      if (live !== null) live.close();
      live = solid(colors[Math.min(index, colors.length - 1)]);
      index += 1;
      return live;
    },
    close: () => { if (live !== null) live.close(); live = null; },
  };
}

function playbackOver(canvas, source, times) {
  return new R.Playback({
    audio: { currentTime: 0, state: "running", resume: () => Promise.resolve() },
    graph: new R.AudioGraph(new OfflineAudioContext(2, 1, 48000),
      { bufferFor: () => Promise.reject(new Error("no audio in this check")) }),
    sourceTimes: times,
    effectParams: () => new Map(),
    createFrameSource: () => source,
  });
}

async function playbackChecks() {
  test("a late frame holds the picture the clip already had", () => {
    const { compositor, scene } = rig(4, 4, "#ff0000", [{}]);
    const blue = solid([0, 0, 255, 255]);
    draw(compositor, scene, 0, new Map([["clp_0", blue]]));
    blue.close();

    draw(compositor, scene, 0, new Map());

    check("the clip is still blue after a tick with no frame",
      reader(compositor.readPixels(), 4, 4)(2, 2), [0, 0, 255, 255]);
  });

  test("a clip that never had a frame paints nothing at all", () => {
    const { compositor, scene } = rig(4, 4, "#ff0000", [{}]);
    draw(compositor, scene, 0, new Map());
    check("the background shows through instead of black",
      reader(compositor.readPixels(), 4, 4)(2, 2), [255, 0, 0, 255]);
  });

  const canvas = canvasOf(4, 4);
  const source = evictingSource([[0, 255, 0, 255], [0, 0, 255, 255]]);
  const playback = playbackOver(canvas, source, (at) => new Map([["clp_0", at]]));
  playback.attach(canvas);
  await playback.load(playbackScene(["clp_0"]));

  playback.seek(0);
  await idle();
  check("playback paints the frame the source handed it",
    Array.from(canvasPixel(canvas, 2, 2)), [0, 255, 0, 255]);

  playback.seek(500);
  await idle();
  check("and the next one, with the one before it already closed",
    Array.from(canvasPixel(canvas, 2, 2)), [0, 0, 255, 255]);

  playback.dispose();
}

// Reads the canvas the way the page does, which is the only view that proves the picture left
// the compositor rather than merely staying in the drawing buffer.
function canvasPixel(canvas, x, y) {
  const two = canvasOf(canvas.width, canvas.height).getContext("2d");
  two.drawImage(canvas, 0, 0);
  return two.getImageData(x, y, 1, 1).data;
}

function idle() {
  return new Promise((resolve) => setTimeout(resolve, 50));
}
