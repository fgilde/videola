<!doctype html>
<!-- I18nProvider sets documentElement.lang from the stored locale on mount; this is only
     the value before any script runs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Installable, and offline after the first visit: everything this editor works on is already
         on the device, so a browser that cannot reach the network is not a browser that cannot
         edit. The worker is registered from the application, not here -- see updates.ts. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#05060a" />
    <link rel="apple-touch-icon" href="/icon-256.png" />
    <title>Videola</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
