<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Videola</title>
    <style>
      /* Self-contained on purpose: this page is shown before the application bundle is parsed, so
         anything it had to fetch would be a thing that could keep it from appearing. No fonts, no
         images, no script -- the mark is drawn as two shapes and the rest is type. */
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: radial-gradient(120% 120% at 30% 0%, #16213b 0%, #05060a 60%);
        color: #f4f6fb;
        font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      /* The play triangle inside a rounded frame: the icon this application is filed under, in two
         elements rather than in a file. */
      .mark {
        position: relative;
        width: 84px;
        height: 84px;
        border-radius: 22px;
        background: linear-gradient(150deg, #5b8cff, #8b5bff);
        box-shadow: 0 18px 40px rgb(5 6 10 / 70%);
      }

      .mark::after {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 15px 0 15px 25px;
        border-color: transparent transparent transparent #f4f6fb;
        transform: translateX(3px);
      }

      .name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      /* A bar that fills once and stays, rather than a spinner that claims to know how long this
         takes. What is being waited for is a WASM module being compiled, and the browser tells
         nobody how far along that is. */
      .bar {
        width: 180px;
        height: 3px;
        border-radius: 2px;
        background: #1c2438;
        overflow: hidden;
      }

      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #5b8cff, #8b5bff);
        animation: sweep 1.1s ease-in-out infinite;
      }

      @keyframes sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }

      /* Somebody who has switched motion off gets a filled bar and no travel. */
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="mark"></div>
    <div class="name">Videola</div>
    <!-- No words beyond the name. This window is shown before the application exists, so there is
         no catalogue to read a sentence out of, and the security policy forbids the inline script it
         would take to pick a language here. A moving bar says "loading" in every language, and a
         German user being told "Starting the editor" would be the one English string in the whole
         product. -->
    <div class="bar"></div>
  </body>
</html>
