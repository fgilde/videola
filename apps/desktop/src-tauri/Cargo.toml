[package]
name = "videola-desktop"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# An empty table makes this crate its own workspace root, which is what keeps it
# out of the root workspace and cargo test --workspace off the Tauri dep tree.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# `generate_context!` bakes any `plugins` block of tauri.conf.json into the binary
# as serde_json values and expects the crate to provide the name. Unused while no
# plugin is configured -- and the release workflow adds the updater block only when
# a signing key exists, so leaving this out would break exactly the build nobody
# runs locally.
serde_json = "1"

# Bound to the desktop targets rather than pulled in unconditionally: the updater
# has no Android or iOS build, and `tauri android build` would stop at it.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[lints.rust]
unsafe_code = "forbid"
