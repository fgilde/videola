server {
  listen 80;
  root /usr/share/nginx/html;

  # Without the right MIME type the browser refuses to instantiate the module.
  # The type is scoped to this location on purpose: a `types` block at server
  # level replaces the inherited mime.types map instead of extending it, which
  # would hand out JS and CSS as application/octet-stream.
  location ~* \.wasm$ {
    types { }
    default_type application/wasm;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Vite gives assets content-hashed names, so they are immutable; index.html
  # names them and must never be.
  location ~* \.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The editor is an SPA: every unknown path has to answer with index.html, or a
  # reload on a subpage breaks.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
