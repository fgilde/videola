# yaml-language-server: $schema=https://fgilde.github.io/QuickRun/quickrun.schema.json
name: videola
description: "The web editor from the pnpm workspace. The WASM core is generated, not committed, so it is built first."

requires:
  - tool: node
    version: ">=20.0"
    install: https://nodejs.org
  - tool: pnpm
    version: ">=11.0"
    install: https://pnpm.io/installation
  - tool: cargo
    install: https://rustup.rs
  - tool: wasm-pack
    install: https://rustwasm.github.io/wasm-pack/installer/

setup:
  - run: pnpm install --frozen-lockfile
  # packages/core/src/wasm ist gitignored (.gitignore:36) und wird von wasm-backend.ts
  # statisch importiert - ohne diesen Schritt laedt die Seite nicht.
  - run: pnpm wasm

tasks:
  - name: web
    run: pnpm --filter ./apps/web dev
    readyWhen: {http: "http://localhost:5173"}
    open: true
